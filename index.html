<!doctype html>
<html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#120A2A"><link rel="manifest" href="manifest.webmanifest"><link rel="apple-touch-icon" href="icon-192.png">
<title>ชำดี POS</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@400;500;600;700&family=Kanit:wght@500;600;700&family=Silkscreen:wght@400;700&display=swap">
<style>
/* Layout: 3D neon "digital void circus" — glass panels float over a perspective grid floor; phone-first app bar + drawer, tablets pin drawer + ticket */
:root{
  --bg:#0D0720; --bg2:#1A0D3D; --surface:rgba(38,22,82,.72); --solid:#1E1244; --bar:rgba(18,10,44,.82); --sunk:rgba(255,255,255,.07); --ink:#F4EFFF; --muted:#B5A6DD; --line:rgba(176,140,255,.24);
  --accent:#FF2E93; --accent-deep:#B3105C; --accent-ink:#FFFFFF; --accent-soft:rgba(255,46,147,.18); --accent-text:#FF85C4;
  --cyan:#3FE0FF; --sun:#FFC83A; --sun-ink:#2A1A00; --violet:#9B6BFF;
  --good:#4CF0A0; --warn:#FFB547; --bad:#FF6B7A; --warn-soft:rgba(255,181,71,.16); --bad-soft:rgba(255,107,122,.16);
  --scrim:rgba(5,2,15,.7);
  --display:"Kanit","IBM Plex Sans Thai","Noto Sans Thai",system-ui,sans-serif;
  --body:"IBM Plex Sans Thai","Noto Sans Thai","Leelawadee UI",Tahoma,system-ui,sans-serif;
  --pixel:"Silkscreen","Courier New",monospace;
  --r:16px; --shadow:0 10px 30px rgba(0,0,0,.4);
  --card:#221447; --topbar:#150B33; --panel:#160C36; --modal:#1F1150; --field:rgba(10,5,28,.55); --btn:rgba(255,255,255,.1); --segon:linear-gradient(180deg,#3A2380,#2A1866); --pxc:#FFC83A; --glow:rgba(255,46,147,.55); --drawer:#1A0D3D;
  --pattern-def:url("data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A//www.w3.org/2000/svg%22%20width%3D%22180%22%20height%3D%22180%22%20viewBox%3D%220%200%20180%20180%22%3E%3Cg%20fill%3D%22none%22%20stroke-linecap%3D%22round%22%20stroke-width%3D%222%22%3E%3Cpath%20d%3D%22M30%2022v12M24%2028h12%22%20stroke%3D%22%23FF5FB4%22%20opacity%3D%22.35%22/%3E%3Cpath%20d%3D%22M132%20104v10M127%20109h10%22%20stroke%3D%22%233FE0FF%22%20opacity%3D%22.3%22/%3E%3Cpath%20d%3D%22M88%20150l6%206-6%206-6-6z%22%20stroke%3D%22%23FFC83A%22%20opacity%3D%22.28%22/%3E%3Ccircle%20cx%3D%22150%22%20cy%3D%2236%22%20r%3D%225%22%20stroke%3D%22%239B6BFF%22%20opacity%3D%22.35%22/%3E%3Ccircle%20cx%3D%2252%22%20cy%3D%22112%22%20r%3D%223.5%22%20stroke%3D%22%233FE0FF%22%20opacity%3D%22.25%22/%3E%3C/g%3E%3Cg%20fill%3D%22%23FFFFFF%22%20opacity%3D%22.28%22%3E%3Ccircle%20cx%3D%22100%22%20cy%3D%2260%22%20r%3D%221.4%22/%3E%3Ccircle%20cx%3D%2216%22%20cy%3D%22160%22%20r%3D%221.2%22/%3E%3Ccircle%20cx%3D%22168%22%20cy%3D%22140%22%20r%3D%221.3%22/%3E%3Ccircle%20cx%3D%2270%22%20cy%3D%2284%22%20r%3D%221%22/%3E%3C/g%3E%3C/svg%3E");
  --pattern:var(--pattern-def);
  color-scheme:dark;
}

[hidden]{display:none!important}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:.9375rem;line-height:1.5;overflow:hidden}
*{box-sizing:border-box}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none;padding:0}
:focus-visible{outline:3px solid var(--sun);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}
h1,h2,h3{font-family:var(--display);font-weight:500;margin:0;text-wrap:balance}
h1{font-size:1.3rem} h2{font-size:1.12rem} h3{font-size:.98rem}
.muted{color:var(--muted)} .small{font-size:.82rem} .grow{flex:1}
.row{display:flex;align-items:center;gap:8px} .wrap{flex-wrap:wrap}

/* shell */
.app{display:grid;grid-template-columns:minmax(0,1fr);grid-template-rows:minmax(0,1fr);height:100%}
.drawer{position:fixed;top:0;bottom:0;left:0;width:min(300px,84vw);background:var(--surface);z-index:40;transform:translateX(-102%);transition:transform .22s ease;display:flex;flex-direction:column;overflow:auto;padding-top:env(safe-area-inset-top,0px)}
.drawer.open{transform:none;box-shadow:8px 0 30px rgba(0,0,0,.25)}
.scrim{position:fixed;inset:0;background:var(--scrim);z-index:39}
.dhead{padding:22px 20px 18px;display:flex;flex-direction:column;gap:6px;border-bottom:1px solid var(--line)}
.dhead .logo{width:64px;height:64px;border-radius:14px;overflow:hidden;display:grid;place-items:center;background:var(--sunk)}
.dhead .logo img{width:100%;height:100%;object-fit:cover}
.dhead .logo svg{width:100%;height:100%}
.dhead b{font-family:var(--display);font-weight:500;font-size:1.25rem;line-height:1.2}
.ditem{display:flex;align-items:center;gap:22px;padding:13px 22px;width:100%;text-align:left;font-size:1rem;font-weight:500}
.ditem svg{width:24px;height:24px;flex:none;color:var(--muted)}
.ditem.on{background:var(--sunk);color:var(--accent-text)}
.ditem.on svg{color:var(--accent)}
.dsep{height:1px;background:var(--line);margin:6px 0}
.dfoot{margin-top:auto;padding:16px 22px;color:var(--muted);font-size:.8rem}
.main{display:flex;flex-direction:column;height:100%;min-width:0;min-height:0;overflow:hidden}
.topbar{display:flex;align-items:center;gap:6px;background:var(--bar);padding:6px 8px;min-height:58px;border-bottom:1px solid var(--line);flex:none}
.topbar h1{font-size:1.2rem;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;padding-left:6px}
.ib{width:44px;height:44px;border-radius:12px;display:grid;place-items:center;flex:none;position:relative}
.ib:hover{background:var(--sunk)}
.ib svg{width:24px;height:24px}
.ticketbadge{display:inline-flex;align-items:center;justify-content:center;min-width:30px;height:32px;padding:0 6px;border:2px solid currentColor;border-radius:4px;font-weight:600;font-size:.95rem;margin-left:4px;clip-path:polygon(0 0,100% 0,100% 88%,88% 100%,76% 88%,64% 100%,52% 88%,40% 100%,28% 88%,16% 100%,0 88%)}
.content{flex:1;overflow:auto;min-height:0}
.page{padding:16px clamp(16px,3vw,28px) 40px;max-width:1100px;margin:0 auto;display:flex;flex-direction:column;gap:14px}
@media (min-width:1100px){
  .app{grid-template-columns:270px minmax(0,1fr)}
  .drawer{position:relative;transform:none;width:auto;border-right:1px solid var(--line);z-index:1}
  .scrim,.menubtn{display:none!important}
}

/* generic */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;min-width:0}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:10px 15px;border-radius:10px;background:var(--sunk);font-weight:500;white-space:nowrap}
.btn:hover{filter:brightness(.97)}
.btn.pri{background:var(--accent);color:var(--accent-ink)}
.btn.sun{background:var(--sun);color:var(--sun-ink)}
.btn.ghost{background:transparent;border:1px solid var(--line)}
.btn.danger{background:var(--bad-soft);color:var(--bad)}
.btn.sm{padding:6px 11px;font-size:.86rem;border-radius:8px}
.btn.block{width:100%}
.btn:disabled{opacity:.45;cursor:not-allowed}
.input{width:100%;padding:11px 12px;border-radius:10px;border:1px solid var(--line);background:var(--surface);min-width:0}
.input:focus{border-color:var(--accent);outline:none;box-shadow:0 0 0 3px var(--accent-soft)}
label.f{display:flex;flex-direction:column;gap:4px;font-size:.85rem;color:var(--muted);min-width:0}
.fgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px}
.chips{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}
.chip{padding:7px 14px;border-radius:999px;background:var(--surface);border:1px solid var(--line);white-space:nowrap;font-size:.88rem}
.chip.on{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.expbar{display:flex;align-items:center;gap:6px;width:100%;margin:0 0 8px;padding:9px 12px;border:0;border-radius:12px;background:var(--warn-soft);color:var(--warn);font:inherit;font-size:.9rem;text-align:left;cursor:pointer}
.pill{display:inline-flex;align-items:center;gap:4px;padding:2px 8px;border-radius:999px;font-size:.75rem;font-weight:600;white-space:nowrap}
.pill.warn{background:var(--warn-soft);color:var(--warn)} .pill.bad{background:var(--bad-soft);color:var(--bad)} .pill.good{background:var(--accent-soft);color:var(--accent-text)}
.seg{display:flex;background:var(--sunk);border-radius:12px;padding:3px;gap:3px}
.seg button{flex:1;padding:9px 6px;border-radius:9px;font-weight:500;color:var(--muted)}
.seg button.on{background:var(--surface);color:var(--ink);box-shadow:var(--shadow)}
.banner{display:flex;align-items:center;gap:10px;flex-wrap:wrap;background:var(--sun);color:var(--sun-ink);padding:9px 14px;font-size:.86rem}
.banner .btn{background:rgba(0,0,0,.12);color:inherit}
.switch{position:relative;width:46px;height:28px;flex:none}
.switch input{opacity:0;width:100%;height:100%;position:absolute;margin:0;cursor:pointer;z-index:1}
.switch i{position:absolute;inset:0;border-radius:999px;background:var(--line);transition:.15s}
.switch i::after{content:"";position:absolute;width:22px;height:22px;border-radius:50%;background:#fff;top:3px;left:3px;transition:.15s;box-shadow:0 1px 3px rgba(0,0,0,.3)}
.switch input:checked+i{background:var(--accent)}
.switch input:checked+i::after{left:21px}

/* menu list (Loyverse-like sub menus) */
.mlist{background:var(--surface);border-radius:var(--r);border:1px solid var(--line);overflow:hidden}
.mrow{display:flex;align-items:center;gap:20px;padding:15px 18px;width:100%;text-align:left;border-bottom:1px solid var(--line);min-width:0}
.mrow:last-child{border-bottom:0}
.mrow svg{width:24px;height:24px;flex:none;color:var(--muted)}
.mrow .t{flex:1;min-width:0}
.mrow .t b{display:block;font-weight:500}
.mrow .chev{width:18px;height:18px}

/* POS */
.pos{display:grid;grid-template-columns:minmax(0,1fr);height:100%}
.posleft{display:flex;flex-direction:column;min-height:0;min-width:0}
.charge{margin:12px;flex:none;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:0;background:var(--accent);color:var(--accent-ink);border-radius:6px;min-height:84px;font-family:var(--display);font-size:1.25rem;line-height:1.3}
.charge:disabled{opacity:.55}
.charge small{font-size:1.05rem;opacity:.95}
.filter{display:flex;align-items:stretch;border-top:1px solid var(--line);border-bottom:1px solid var(--line);background:var(--bar);flex:none}
.filter select{flex:1;border:0;background:transparent;padding:14px 16px;font-size:1rem;min-width:0;appearance:none;-webkit-appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--muted) 50%),linear-gradient(135deg,var(--muted) 50%,transparent 50%);background-position:calc(100% - 22px) 50%,calc(100% - 16px) 50%;background-size:6px 6px;background-repeat:no-repeat}
.filter .sbtn{width:60px;border-left:1px solid var(--line);display:grid;place-items:center}
.filter .sbtn svg{width:24px;height:24px}
.filter input{flex:1;border:0;background:transparent;padding:14px 8px;outline:none;min-width:0;font-size:1rem;color:var(--ink)}
.filter .qwrap{flex:1;display:flex;align-items:center;gap:4px;padding-left:14px;min-width:0;background:var(--field);cursor:text}
.filter .qwrap svg{width:20px;height:20px;flex:none;opacity:.6}
.filter input::-webkit-search-cancel-button{display:none}
.filter select.catsel{flex:0 0 auto;width:min(34vw,150px);border-left:1px solid var(--line);padding:14px 26px 14px 12px;font-size:.9rem;text-overflow:ellipsis;white-space:nowrap;overflow:hidden}
.gridscroll{flex:1;min-height:0;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch}
.grid{padding:12px;display:grid;grid-template-columns:repeat(auto-fill,minmax(104px,1fr));grid-auto-rows:auto;gap:10px;align-content:start}
.tile{flex:none;width:100%;height:auto}
.tile{position:relative;aspect-ratio:1;border-radius:4px;overflow:hidden;color:#fff;display:flex;flex-direction:column;justify-content:flex-end;text-align:center;box-shadow:var(--shadow);transition:transform .08s}
.tile:active{transform:scale(.96)}
.tile img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.tile .nm{position:relative;padding:6px 6px 7px;font-size:.84rem;line-height:1.25;background:rgba(0,0,0,.52);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;font-weight:500}
.tile.noimg{justify-content:center}
.tile.noimg .nm{background:none;font-size:.95rem;-webkit-line-clamp:3;padding:8px}
.tile .pr{position:absolute;top:6px;left:6px;background:rgba(0,0,0,.55);border-radius:6px;padding:1px 6px;font-size:.75rem;font-weight:600}
.tile .q{position:absolute;top:6px;right:6px;background:var(--sun);color:var(--sun-ink);border-radius:999px;min-width:24px;height:24px;display:grid;place-items:center;font-size:.8rem;font-weight:700;padding:0 6px}
.tile .lo{position:absolute;top:30px;left:6px}
.tile.out{filter:grayscale(.7);opacity:.7}
.ticket{background:var(--surface);display:flex;flex-direction:column;min-height:0;height:100%}
.tkhead{display:flex;align-items:center;gap:6px;padding:8px 8px 8px 16px;border-bottom:1px solid var(--line);min-height:58px}
.tkcust{display:flex;align-items:center;gap:12px;padding:12px 16px;border-bottom:1px solid var(--line);width:100%;text-align:left}
.avatar{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;background:var(--sun);color:var(--sun-ink);font-family:var(--display);flex:none}
.tklines{flex:1;overflow:auto;min-height:60px}
.tkl{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 10px;padding:11px 16px;border-bottom:1px solid var(--line)}
.tkl .n{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.step{display:flex;align-items:center;gap:2px}
.step button{width:32px;height:30px;border-radius:8px;background:var(--sunk);font-size:1.1rem;line-height:1}
.step span{min-width:30px;text-align:center;font-weight:600}
.tksum{padding:10px 16px;border-top:1px solid var(--line);display:flex;flex-direction:column;gap:4px}
.sr{display:flex;justify-content:space-between;align-items:center;gap:10px;font-size:.92rem}
.sr.tot{font-family:var(--display);font-size:1.15rem}
.sr button.link{color:var(--accent-text);font-weight:500}
.tkfoot{padding:10px 16px calc(12px + env(safe-area-inset-bottom,0px))}
.empty{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;text-align:center;padding:28px 12px;color:var(--muted)}
.bubble{background:var(--sunk);color:var(--ink);padding:8px 14px;border-radius:14px 14px 14px 4px;font-size:.9rem;max-width:240px}
.tkpanel{display:none}
@media (min-width:820px){
  .pos{grid-template-columns:minmax(0,1fr) 360px}
  .tkpanel{display:flex;border-left:1px solid var(--line)}
  .charge.mobile{display:none}
  .posleft .grid{padding-top:12px}
}

/* full-screen sheets (ticket on phone, payment, receipt detail) */
.sheet{position:fixed;inset:0;z-index:50;background:var(--bg);display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0px)}
.sheet .content{padding-bottom:env(safe-area-inset-bottom,0px)}
@media (min-width:820px){
  .sheet{inset:auto;top:50%;left:50%;transform:translate(-50%,-50%);width:min(560px,94vw);max-height:92vh;border-radius:16px;box-shadow:0 20px 60px rgba(0,0,0,.35);overflow:hidden}
  .sheetscrim{position:fixed;inset:0;background:var(--scrim);z-index:49}
}
.due{font-family:var(--display);font-size:2.6rem;text-align:center;line-height:1.1}
.notes{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.notes button{padding:13px 6px;border-radius:10px;background:var(--surface);border:1px solid var(--line);font-family:var(--display);font-size:1.05rem}
.notes button.on{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.methods{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.methods button{display:flex;flex-direction:column;align-items:center;gap:4px;padding:12px 6px;border-radius:12px;background:var(--surface);border:2px solid var(--line);font-weight:500;font-size:.9rem}
.methods button svg{width:26px;height:26px}
.methods button.on{border-color:var(--accent);background:var(--accent-soft);color:var(--accent-text)}
.methods button:disabled{opacity:.4}
.change{display:flex;justify-content:space-between;align-items:center;padding:14px 16px;border-radius:12px;background:var(--accent-soft)}
.change b{font-family:var(--display);font-size:1.7rem;color:var(--accent-text)}
.qrbox{display:flex;flex-direction:column;align-items:center;gap:8px;padding:14px;border-radius:14px;background:#fff;color:#111}
.qrbox img,.qrbox canvas{width:220px;height:220px}
.done{display:flex;flex-direction:column;align-items:center;gap:6px;padding:20px 0 6px;text-align:center}
.done .big{font-family:var(--display);font-size:2.4rem;line-height:1.1}
.receipt{background:#fff;color:#1a1a1a;border-radius:4px;padding:18px 16px;width:min(330px,100%);margin:0 auto;font-size:.85rem;box-shadow:var(--shadow);font-variant-numeric:tabular-nums;line-height:1.45}
.receipt .c{text-align:center}
.receipt hr{border:0;border-top:1px dashed #999;margin:8px 0}
.receipt .rr{display:flex;justify-content:space-between;gap:8px}
.receipt .b{font-weight:700;font-size:1.05rem}
.receipt .logo{max-width:120px;max-height:80px;margin:0 auto 4px;display:block}

/* receipts list */
.dayh{padding:14px 18px 8px;color:var(--accent-text);font-weight:600;font-size:.92rem;border-bottom:1px solid var(--line);background:var(--bg);position:sticky;top:0;z-index:1}
.rrow{display:flex;align-items:center;gap:18px;padding:12px 18px;width:100%;text-align:left;border-bottom:1px solid var(--line);background:var(--surface)}
.rrow svg{width:28px;height:28px;color:var(--muted);flex:none}
.rrow .a{flex:1;min-width:0}
.rrow .a b{font-size:1.05rem;font-weight:600;display:block}
.rrow.ref .a b{text-decoration:line-through;color:var(--muted)}
.searchbar{display:flex;align-items:center;gap:14px;padding:4px 18px;background:var(--bar);border-bottom:1px solid var(--line);flex:none}
.searchbar svg{width:22px;height:22px;color:var(--muted);flex:none}
.searchbar input{flex:1;border:0;background:transparent;padding:13px 0;outline:none;min-width:0;font-size:1rem}

/* tables & lists */
.list{display:flex;flex-direction:column}
.li{display:flex;align-items:center;gap:12px;padding:11px 4px;border-bottom:1px solid var(--line);min-width:0;text-align:left;width:100%}
.li:last-child{border-bottom:0}
.li .m{flex:1;min-width:0}
.li .m b{display:block;font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.thumb{width:44px;height:44px;border-radius:8px;flex:none;overflow:hidden;display:grid;place-items:center;color:#fff;font-family:var(--display)}
.thumb img{width:100%;height:100%;object-fit:cover}
.tblw{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:.9rem}
th{font-weight:500;color:var(--muted);text-align:left;font-size:.78rem;letter-spacing:.02em;padding:9px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:10px;border-bottom:1px solid var(--line);white-space:nowrap}
td.r,th.r{text-align:right}
tr:last-child td{border-bottom:0}
.sh{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px;vertical-align:-1px}

/* back office */
.bo-tabs{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none;background:var(--bar);border-bottom:1px solid var(--line);padding:0 8px;flex:none}
.bo-tabs button{padding:13px 12px;white-space:nowrap;color:var(--muted);font-weight:500;border-bottom:3px solid transparent}
.bo-tabs button.on{color:var(--accent-text);border-color:var(--accent)}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:13px 15px;min-width:0}
.kpi .k{font-size:.8rem;color:var(--muted)}
.kpi .v{font-family:var(--display);font-size:1.45rem;line-height:1.25;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.kpi .d{font-size:.76rem;font-weight:600}
.up{color:var(--good)} .down{color:var(--bad)}
.bars{display:flex;align-items:flex-end;gap:3px;height:190px;border-bottom:1px solid var(--line);background-image:linear-gradient(var(--line) 1px,transparent 1px);background-size:100% 25%}
.bar{flex:1;min-width:0;display:flex;flex-direction:column;justify-content:flex-end;height:100%;cursor:pointer}
.bar i{display:block;background:var(--accent);opacity:.35}
.bar i.p{opacity:1;border-radius:4px 4px 0 0}
.bar.sel{outline:2px solid var(--sun);outline-offset:1px}
.xl{display:flex;gap:3px}
.xl span{flex:1;min-width:0;text-align:center;font-size:.68rem;color:var(--muted);overflow:hidden;white-space:nowrap}
.legend{display:flex;gap:14px;font-size:.78rem;color:var(--muted);flex-wrap:wrap}
.split{display:grid;grid-template-columns:200px minmax(0,1fr);gap:20px;align-items:center}
.donut{width:200px;max-width:100%;aspect-ratio:1;position:relative}
.donut svg{width:100%;height:100%}
.donut .ctr{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}
.donut .ctr b{font-family:var(--display);font-size:1.15rem;font-weight:500}
.share{height:6px;border-radius:4px;background:var(--sunk);overflow:hidden;min-width:60px}
.share i{display:block;height:100%}
.insight{display:flex;gap:10px;align-items:flex-start;padding:6px 0}
.insight .dot{width:8px;height:8px;border-radius:50%;background:var(--sun);margin-top:8px;flex:none}
.range{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.range input[type=date]{padding:7px 10px;border-radius:9px;border:1px solid var(--line);background:var(--surface)}

/* mascot editor */
.mz{display:grid;grid-template-columns:200px minmax(0,1fr);gap:20px;align-items:start}
.mzprev{background:var(--sunk);border-radius:18px;padding:16px;display:flex;flex-direction:column;align-items:center;gap:8px}
.swatches{display:flex;gap:8px;flex-wrap:wrap}
.sw{width:34px;height:34px;border-radius:50%;border:3px solid var(--surface);box-shadow:0 0 0 1px var(--line)}
.sw.on{box-shadow:0 0 0 3px var(--ink)}
.logobox{width:120px;height:120px;border-radius:16px;border:2px dashed var(--line);display:grid;place-items:center;overflow:hidden;background:var(--surface)}
.logobox img{width:100%;height:100%;object-fit:contain}
.cap .t{height:10px;border-radius:6px;background:var(--sunk);overflow:hidden}
.cap .t i{display:block;height:100%;background:linear-gradient(90deg,var(--accent),var(--sun))}

.modal{position:fixed;inset:0;background:var(--scrim);display:flex;align-items:center;justify-content:center;padding:16px;z-index:60}
.mbox{background:var(--surface);border-radius:18px;width:min(500px,100%);max-height:calc(100% - 20px);overflow:auto;padding:20px;display:flex;flex-direction:column;gap:14px;box-shadow:0 20px 60px rgba(0,0,0,.3)}
.mh{display:flex;align-items:center;gap:10px}
.x{width:36px;height:36px;border-radius:10px;background:var(--sunk);font-size:1.2rem;margin-left:auto;flex:none}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:12px;z-index:70;font-size:.9rem;box-shadow:var(--shadow);max-width:calc(100% - 32px)}
.pin input{width:200px;text-align:center;font-size:1.6rem;letter-spacing:.4em}
@media (max-width:620px){
  .split,.mz{grid-template-columns:minmax(0,1fr)}
  .donut{margin:0 auto}
  .hide-sm{display:none}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}

/* ===== 3D neon theme layer ===== */
/* flat 2D static background: small repeating pattern of sparkles on a solid colour */
body{background:var(--bgimg,none) center/cover no-repeat fixed,var(--pattern) 0 0/180px 180px repeat,var(--bg)}
.app{position:relative;z-index:1}
h1,h2,h3{font-family:var(--display);font-weight:600;letter-spacing:.01em}
h1{text-shadow:0 0 18px var(--glow)}
.topbar h1{text-shadow:none;background:none}
.px{font-family:var(--pixel);font-weight:700;letter-spacing:.12em;color:var(--pxc);text-shadow:0 0 10px var(--glow);text-transform:uppercase}
.drawer{background:var(--drawer);border-right:1px solid var(--line)}
.dhead{position:relative;overflow:hidden;background:linear-gradient(180deg,rgba(13,7,32,.15),rgba(13,7,32,.92)),var(--stage) center 30%/cover}
.dhead .logo{width:84px;height:84px;border-radius:50%;background:rgba(255,255,255,.08);box-shadow:0 0 0 2px rgba(255,255,255,.18),0 0 24px rgba(255,46,147,.55)}
.ditem.on{background:linear-gradient(90deg,var(--accent-soft),transparent);color:var(--ink);box-shadow:inset 3px 0 0 var(--accent)}
.ditem.on svg{color:var(--accent-text);filter:drop-shadow(0 0 6px var(--accent))}
.topbar{background:var(--topbar);border-bottom:1px solid transparent;box-shadow:0 1px 0 rgba(255,46,200,.45),0 8px 24px rgba(0,0,0,.25)}
.card,.kpi,.mlist{background:var(--card);box-shadow:inset 0 1px 0 rgba(255,255,255,.1),0 12px 30px rgba(0,0,0,.35)}
.kpi .v{text-shadow:0 0 14px var(--glow)}
.mbox{background:var(--modal);border:1px solid var(--line);box-shadow:0 0 0 1px rgba(255,46,147,.25),0 30px 80px rgba(0,0,0,.6)}
.sheet{background:var(--pattern) 0 0/180px 180px repeat,var(--bg)}
.input,.filter select{background:var(--field);border-color:var(--line)}
.input:focus{border-color:var(--cyan);box-shadow:0 0 0 3px rgba(63,224,255,.25),0 0 16px rgba(63,224,255,.35)}
select option{background:var(--card);color:var(--ink)}
/* pressable 3D buttons */
.btn{background:var(--btn);border:1px solid var(--line);color:var(--ink);box-shadow:0 4px 0 rgba(0,0,0,.45);transition:transform .06s,box-shadow .06s}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 rgba(0,0,0,.45)}
.btn.pri,.charge{background:linear-gradient(180deg,#FF63B2 0%,#FF2E93 55%,#E8157E 100%);color:#fff;border:0;box-shadow:0 6px 0 var(--accent-deep),0 12px 28px rgba(255,46,147,.45);text-shadow:0 1px 0 rgba(0,0,0,.25)}
.btn.pri:active,.charge:active{transform:translateY(4px);box-shadow:0 2px 0 var(--accent-deep),0 6px 16px rgba(255,46,147,.4)}
.btn.sun{background:linear-gradient(180deg,#FFE07A,#FFC83A);box-shadow:0 5px 0 #B98500;border:0}
.btn.danger{background:rgba(255,107,122,.15);border-color:rgba(255,107,122,.35)}
.btn.ghost{background:transparent;box-shadow:none}
.charge{border-radius:18px;font-family:var(--display);font-weight:600;transition:transform .06s,box-shadow .06s}
.charge:disabled{opacity:.5;box-shadow:0 6px 0 #5a1240}
.chip{background:var(--sunk);border-color:var(--line)}
.chip.on{background:linear-gradient(180deg,#46E6FF,#18B8E0);color:#06202C;border-color:transparent;box-shadow:0 3px 0 #0B7896,0 0 16px rgba(63,224,255,.5)}
.seg{background:rgba(0,0,0,.3)}
.seg button.on{background:var(--segon);color:#fff;box-shadow:0 3px 0 rgba(0,0,0,.45),0 0 0 1px rgba(255,255,255,.12)}
.switch input:checked+i{background:var(--accent);box-shadow:0 0 12px rgba(255,46,147,.6)}
.methods button{background:var(--sunk);border-color:var(--line);box-shadow:0 5px 0 rgba(0,0,0,.4)}
.methods button.on{background:var(--accent-soft);border-color:var(--accent);color:var(--ink);box-shadow:0 5px 0 var(--accent-deep),0 0 18px rgba(255,46,147,.4)}
.notes button{background:var(--sunk);box-shadow:0 4px 0 rgba(0,0,0,.4)}
.notes button.on{background:linear-gradient(180deg,#46E6FF,#18B8E0);color:#06202C;box-shadow:0 4px 0 #0B7896}
.change{background:rgba(76,240,160,.12);border:1px solid rgba(76,240,160,.35)}
.change b{color:var(--good);text-shadow:0 0 14px rgba(76,240,160,.6)}
.filter{background:var(--bar);border-color:var(--line)}
/* 3D product tiles */
.grid{gap:12px}
.tile{border-radius:16px;box-shadow:0 7px 0 rgba(0,0,0,.45),0 14px 24px rgba(0,0,0,.35),inset 0 0 0 1px rgba(255,255,255,.16)}
.tile::after{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;background:linear-gradient(155deg,rgba(255,255,255,.38) 0%,rgba(255,255,255,0) 38%,rgba(0,0,0,0) 62%,rgba(0,0,0,.28) 100%)}
.tile.noimg{background-image:radial-gradient(120% 90% at 30% 10%,rgba(255,255,255,.28),rgba(255,255,255,0) 60%)!important}
@media (hover:hover){.tile:hover{filter:brightness(1.08)}}
.tile:active{transform:translateY(4px);box-shadow:0 2px 0 rgba(0,0,0,.45),inset 0 0 0 1px rgba(255,255,255,.16)}
.tile .nm{font-family:var(--display);font-weight:500;text-shadow:0 1px 2px rgba(0,0,0,.6)}
.tile .q{background:var(--cyan);color:#06202C;box-shadow:0 0 12px rgba(63,224,255,.8)}
.ticket{background:var(--panel)}
.tkpanel{border-left:1px solid var(--line)}
.tkl,.tkhead,.tkcust,.tksum{border-color:var(--line)}
.ticketbadge{color:var(--cyan);text-shadow:0 0 8px var(--cyan)}
/* character on a glowing stage */
.stage3d{position:relative;display:grid;place-items:center;padding-bottom:18px}
.stage3d::after{content:"";position:absolute;bottom:0;width:78%;height:26px;border-radius:50%;background:radial-gradient(closest-side,rgba(255,255,255,.85),rgba(160,120,255,.6) 45%,rgba(255,46,147,0));filter:blur(1px);box-shadow:0 0 30px rgba(255,46,200,.6)}
.mchar{display:block;border-radius:24%;box-shadow:0 0 0 2px rgba(255,255,255,.22),0 0 26px rgba(255,46,147,.55);animation:bob 3.2s ease-in-out infinite;will-change:transform}
@keyframes bob{50%{transform:translateY(-6px)}}
.bubble{background:var(--sunk);border:1px solid var(--line)}
.dayh{background:var(--bg);color:var(--cyan)}
.rrow{background:var(--card)}
.searchbar{background:var(--bar)}
.bo-tabs{background:var(--bar)}
.bo-tabs button.on{color:var(--ink);border-color:var(--accent);text-shadow:0 0 10px var(--glow)}
.bars{background-image:linear-gradient(var(--line) 1px,transparent 1px)}
.bar i{background:var(--violet)}
.bar i.p{background:linear-gradient(180deg,#FF63B2,#FF2E93);box-shadow:0 0 10px rgba(255,46,147,.6)}
.banner{background:linear-gradient(90deg,#FFC83A,#FF9F3A);color:#2A1A00}
.receipt{color:#1a1a1a}
.pill.good{background:rgba(76,240,160,.15);color:var(--good)}
.lucky{position:relative;overflow:hidden;border-radius:20px;padding:18px;border:1px solid rgba(255,46,147,.4);background:linear-gradient(160deg,rgba(80,34,170,.85),rgba(28,12,70,.9));box-shadow:0 0 30px rgba(155,107,255,.35),inset 0 1px 0 rgba(255,255,255,.12);display:flex;flex-direction:column;gap:10px}
.lucky{color:#F4EFFF}.lucky .input{color:var(--ink)}.lucky .btn:not(.pri){color:var(--ink)}.lucky .muted,.lucky label.f,.lucky .small{color:rgba(244,239,255,.78)}
.lucky .big{font-family:var(--display);font-weight:700;font-size:2.2rem;line-height:1}
.lucky .pts{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.lucky .pts div{background:rgba(255,255,255,.08);border-radius:14px;padding:12px;text-align:center}
.lucky .pts b{display:block;font-family:var(--display);font-size:1.8rem;line-height:1.1}
.prog{height:10px;border-radius:6px;background:rgba(0,0,0,.35);overflow:hidden}
.prog i{display:block;height:100%;transition:width .3s;background:linear-gradient(90deg,var(--cyan),var(--accent));box-shadow:0 0 12px var(--accent)}
.promo{border-radius:18px;overflow:hidden;border:1px solid var(--line);background:#120a2c}
.promo img.art{width:100%;display:block}
.promo .qrw{display:flex;gap:14px;align-items:center;padding:14px}
.promo .qrw .q{background:#fff;padding:8px;border-radius:12px;box-shadow:0 0 0 3px #FF3EA5,0 0 18px rgba(255,62,165,.6);flex:none}
.promo .qrw .q img,.promo .qrw .q canvas{width:120px!important;height:120px!important;display:block}
.charpick{display:grid;grid-template-columns:repeat(auto-fill,minmax(92px,1fr));gap:10px}
.charpick button{border-radius:18px;overflow:hidden;border:2px solid var(--line);background:rgba(255,255,255,.05);display:flex;flex-direction:column;align-items:center;padding-bottom:6px;box-shadow:0 5px 0 rgba(0,0,0,.4)}
.charpick button img{width:100%;aspect-ratio:1;object-fit:cover;object-position:50% 15%}
.charpick button span{font-family:var(--pixel);font-size:.72rem;color:var(--sun);margin-top:4px}
.charpick button.on{border-color:var(--accent);box-shadow:0 5px 0 var(--accent-deep),0 0 18px rgba(255,46,147,.5)}
.dot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:6px;vertical-align:1px}
.dot.on{background:var(--good);box-shadow:0 0 8px var(--good)} .dot.off{background:#6b5d8f} .dot.warn{background:var(--warn);box-shadow:0 0 8px var(--warn)}
pre.code{background:rgba(0,0,0,.45);border:1px solid var(--line);border-radius:12px;padding:12px;max-height:220px;overflow:auto;font-size:.72rem;white-space:pre}

/* ===== scanner ===== */
.scanwrap{position:relative;background:#000;aspect-ratio:4/3;max-height:58vh;width:100%;overflow:hidden}
.scanwrap video{width:100%;height:100%;object-fit:cover;display:block}
.scanframe{position:absolute;inset:0;display:grid;place-items:center;pointer-events:none}
.scanframe i{width:min(80%,440px);aspect-ratio:1.5;border:3px solid var(--cyan);border-radius:18px;box-shadow:0 0 0 2000px rgba(0,0,0,.35),0 0 24px var(--cyan);position:relative;overflow:hidden;transition:border-color .15s}
.scanframe i::after{content:"";position:absolute;left:6%;right:6%;height:2px;background:var(--accent);box-shadow:0 0 12px var(--accent);animation:sweep 1.5s ease-in-out infinite alternate}
@keyframes sweep{from{top:10%}to{top:90%}}
.scanwrap.hit .scanframe i{border-color:var(--good);box-shadow:0 0 0 2000px rgba(0,0,0,.35),0 0 34px var(--good)}
.scanwrap.miss .scanframe i{border-color:var(--bad)}
.scanmsg{position:absolute;left:12px;right:12px;bottom:12px;text-align:center;background:rgba(0,0,0,.65);border-radius:10px;padding:8px 10px;font-size:.92rem}
/* ===== customer display ===== */
body.cdsmode{overflow:hidden}
.cds{position:relative;z-index:1;height:100%;display:flex;flex-direction:column}
.cdsh{display:flex;align-items:center;gap:14px;padding:10px clamp(16px,3vw,28px);background:var(--topbar);box-shadow:0 1px 0 rgba(255,46,200,.45);flex:none}
.cdslogo{width:58px;height:58px;border-radius:50%;overflow:hidden;display:grid;place-items:center;background:rgba(255,255,255,.08);flex:none}
.cdslogo img{width:100%;height:100%;object-fit:cover}
.cdsh b{font-family:var(--display);font-weight:600;font-size:1.4rem;display:block;line-height:1.2}
.cdsclock{font-family:var(--display);font-size:1.4rem;color:var(--cyan);text-shadow:0 0 12px rgba(63,224,255,.6)}
.cdsmain{flex:1;min-height:0;overflow:auto;padding:20px clamp(16px,3vw,32px)}
.cds-idle{display:grid;grid-template-columns:minmax(0,1.35fr) minmax(0,1fr);gap:26px;min-height:100%;align-items:center}
.cdshero{display:flex;flex-direction:column;align-items:center;gap:16px;text-align:center}
.cdshero h1{font-size:clamp(1.7rem,3.6vw,2.8rem)}
.bubble.big{font-size:1.25rem;padding:12px 22px}
.cdsside{display:flex;flex-direction:column;gap:16px;min-width:0}
.cds-cart{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(300px,1fr);gap:20px;height:100%}
.cdslines{overflow:auto;padding:4px 20px;min-height:0}
.cl{display:grid;grid-template-columns:minmax(0,1fr) auto auto;gap:16px;align-items:center;padding:15px 0;border-bottom:1px solid var(--line);font-size:1.2rem}
.cl:last-child{border-bottom:0}
.cl .n{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cl .qx{color:var(--muted);font-size:1rem}
.cl b{font-family:var(--display);font-weight:600}
.cl.new{animation:flash 1.4s ease-out}
@keyframes flash{0%{background:rgba(63,224,255,.32)}100%{background:rgba(63,224,255,0)}}
.cdssum{display:flex;flex-direction:column;gap:14px;min-width:0;overflow:auto}
.cdstot{font-family:var(--display);font-weight:700;font-size:clamp(2.8rem,6.5vw,4.6rem);line-height:1.05;color:#fff;text-shadow:0 0 26px rgba(255,46,147,.75)}
.cdssum .sr{font-size:1.05rem}
.cds-done{display:flex;flex-direction:column;align-items:center;gap:16px;text-align:center;max-width:640px;margin:0 auto}
.cds-done h1{font-size:clamp(2rem,5vw,3.2rem)}
.cdspair{display:flex;flex-direction:column;align-items:center;gap:8px;text-align:center}
.cdspair .code{font-family:var(--pixel);font-size:2.3rem;letter-spacing:.18em;color:var(--sun);text-shadow:0 0 14px rgba(255,200,58,.7)}
.qbox{background:#fff;padding:10px;border-radius:14px;display:inline-block}
.qbox img,.qbox canvas{width:150px!important;height:150px!important;display:block}
.qrbox.big img,.qrbox.big canvas{width:270px!important;height:270px!important}
.cdsfoot{flex:none;display:flex;gap:10px;align-items:center;justify-content:space-between;padding:6px clamp(16px,3vw,28px);font-size:.78rem;color:var(--muted)}
@media (max-width:800px){.cds-idle,.cds-cart{grid-template-columns:minmax(0,1fr);height:auto}.cdslines{max-height:46vh}}

/* ===== manual ===== */
.ghero{display:flex;gap:16px;align-items:center;flex-wrap:wrap}
.gsec{background:var(--card);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.gsec summary{display:flex;align-items:center;gap:12px;padding:14px 16px;cursor:pointer;list-style:none;font-size:1.02rem}
.gsec summary::-webkit-details-marker{display:none}
.gsec summary b{font-family:var(--display);font-weight:500;flex:1}
.gsec summary::after{content:"+";font-size:1.4rem;color:var(--muted);line-height:1}
.gsec[open] summary::after{content:"−"}
.gsec[open] summary{border-bottom:1px solid var(--line)}
.gsec summary svg{color:var(--cyan);flex:none}
.gnum{width:28px;height:28px;border-radius:9px;background:var(--accent-soft);color:var(--accent-text);display:grid;place-items:center;font-weight:600;font-size:.85rem;flex:none}
.gbody{padding:12px 18px 16px;display:flex;flex-direction:column;gap:10px;line-height:1.65}
.gbody p{margin:0}
.gbody ol,.gbody ul{margin:0;padding-left:1.3em;display:flex;flex-direction:column;gap:6px}
.gbody h4{margin:6px 0 0;font-family:var(--display);font-weight:500;color:var(--sun);font-size:.95rem}
.gbody code{background:rgba(0,0,0,.35);border:1px solid var(--line);border-radius:6px;padding:0 6px;font-size:.88em}
.gbody .tip{background:rgba(63,224,255,.08);border-left:3px solid var(--cyan);padding:8px 12px;border-radius:0 10px 10px 0;font-size:.9rem}
.gbody dl{margin:0;display:flex;flex-direction:column;gap:10px}
.gbody dt{font-weight:600}
.gbody dd{margin:2px 0 0;color:var(--muted)}

/* ===== appearance page ===== */
.themes{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:10px}
.theme{border-radius:16px;border:2px solid var(--line);overflow:hidden;text-align:left;background:var(--card);box-shadow:0 4px 0 rgba(0,0,0,.25)}
.theme.on{border-color:var(--accent);box-shadow:0 4px 0 var(--accent-deep),0 0 14px var(--accent-soft)}
.theme .pv{height:64px;display:flex;align-items:flex-end;gap:6px;padding:8px}
.theme .pv i{display:block;border-radius:6px}
.theme span{display:block;padding:8px 10px;font-size:.88rem;font-weight:500}
.fonts{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.fontbtn{border:2px solid var(--line);border-radius:12px;padding:10px 12px;text-align:left;background:var(--sunk);line-height:1.3}
.fontbtn.on{border-color:var(--accent);background:var(--accent-soft)}
.fontbtn b{display:block;font-size:1.05rem;font-weight:500}
.fontbtn small{color:var(--muted);font-family:var(--body)}
.bgprev{width:96px;height:96px;border-radius:14px;border:1px solid var(--line);background-size:cover;background-position:center;flex:none}
@media (prefers-reduced-motion:reduce){.mchar,.scanframe i::after{animation:none}}
.charpick .mdel{position:absolute!important;top:6px!important;right:6px!important;left:auto!important;bottom:auto!important;width:32px!important;height:32px!important;padding:0!important;border-radius:50%!important;background:#e5484d!important;color:#fff!important;display:grid!important;place-items:center!important;font:700 16px/1 sans-serif!important;box-shadow:0 2px 8px rgba(0,0,0,.4)}
.mbar{display:flex;gap:8px;margin:0 12px 10px;flex:none}
.mbar button{border-radius:14px;border:1px solid var(--line);background:var(--card);color:var(--ink);min-height:56px;display:flex;align-items:center;gap:10px;padding:8px 12px;text-align:left;font:inherit}
.mbar .mb-pick{flex:1;min-width:0}.mbar .mb-pick svg{width:26px;height:26px;flex:none}
.mbar .mb-pick span{display:flex;flex-direction:column;min-width:0}.mbar .mb-pick b{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mbar .mb-pick small{color:var(--muted);font-size:.78rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mbar .mb-pick.on{border:2px solid var(--accent)}.mbar .avatar{flex:none}
.mbar .mb-new{flex:none;background:var(--accent);color:#fff;border:0;font-weight:700;justify-content:center;padding:8px 14px}
.mbar .mb-x{flex:none;width:52px;justify-content:center}.mbar .mb-x svg{width:20px;height:20px}
.ib.addcust{background:var(--accent);color:#fff;border-radius:50%}.ib.addcust svg{stroke:#fff}

const BRIDGE_CODE = "/**\n * ชำดี POS Cloud — ตัวเชื่อม Google ของร้าน (ฟรี)\n *  1) ซิงก์ข้อมูลร้านระหว่างมือถือ/แท็บเล็ตหลายเครื่อง (เก็บใน Google Sheet ของคุณเอง)\n *  2) เชื่อมระบบสมาชิก Lucky Points (ชีต \"สมาชิก\")\n *\n * ติดตั้งครั้งแรก\n *  1. script.google.com → โครงการใหม่ → ตั้งชื่อ \"ChamdeeCloud\" → ลบโค้ดเดิม วางไฟล์นี้ → บันทึก\n *  2. เลือกฟังก์ชัน setup → เรียกใช้ → อนุญาตสิทธิ์ → ดู \"รหัส POS\" ในบันทึกการดำเนินการ\n *  3. ทำให้ใช้งานได้ → การทำให้ใช้งานได้รายการใหม่ → เว็บแอป\n *       เรียกใช้ในฐานะ: ฉัน · ผู้มีสิทธิ์เข้าถึง: ทุกคน → คัดลอก URL (/exec)\n *  4. แอปชำดี: การเชื่อมต่อ → วาง URL + รหัส POS → บันทึกและทดสอบ\n *\n * เคยติดตั้งตัวเชื่อมเวอร์ชันเก่า (POS Bridge) แล้ว\n *  วางโค้ดนี้ทับ → บันทึก → เรียกใช้ setup อีกครั้ง →\n *  ทำให้ใช้งานได้ → จัดการการทำให้ใช้งานได้ → ✎ แก้ไข → เวอร์ชัน: เวอร์ชันใหม่ → ทำให้ใช้งานได้ (URL เดิม)\n */\nconst MEMBER_SHEET_ID = '1K2LTSrxoprjbm1zKAF5lMMWgzoA1f4rcqQR_lt5aSJs'; // ชีต \"สมาชิก\" (Lucky Points)\nconst TZ = 'Asia/Bangkok';\nconst CHUNK = 40000; // ตัวอักษรต่อช่อง (Google Sheet รับได้ 50,000)\n\nfunction props_() { return PropertiesService.getScriptProperties(); }\n\nfunction setup() {\n  const p = props_();\n  let k = p.getProperty('POS_KEY');\n  if (!k) { k = Utilities.getUuid().replace(/-/g, '').slice(0, 16); p.setProperty('POS_KEY', k); }\n  let ss = null, id = p.getProperty('DATA_ID');\n  if (id) { try { ss = SpreadsheetApp.openById(id); } catch (e) { ss = null; } }\n  if (!ss) { ss = SpreadsheetApp.create('ชำดี POS – ข้อมูลร้าน (ห้ามแก้ไขเอง)'); p.setProperty('DATA_ID', ss.getId()); }\n  ensureSheets_(ss);\n  try { SpreadsheetApp.openById(MEMBER_SHEET_ID).getSheetByName('Purchases'); } catch (e) { Logger.log('ยังเปิดชีตสมาชิกไม่ได้ (ข้ามได้ถ้าไม่ใช้ Lucky Points): ' + e); }\n  Logger.log('รหัส POS ของคุณ: ' + k);\n  Logger.log('ชีตเก็บข้อมูลร้าน: ' + ss.getUrl());\n}\n\nfunction ensureSheets_(ss) {\n  let o = ss.getSheetByName('Ops');\n  if (!o) { o = ss.insertSheet('Ops'); o.appendRow(['id', 'time', 'device', 'type', 'parts', 'data']); }\n  let s = ss.getSheetByName('Snapshot');\n  if (!s) { s = ss.insertSheet('Snapshot'); s.appendRow(['chunk']); }\n  ss.getSheets().forEach(sh => { const n = sh.getName(); if (n !== 'Ops' && n !== 'Snapshot' && sh.getLastRow() === 0 && ss.getSheets().length > 2) ss.deleteSheet(sh); });\n}\nfunction data_() { const ss = SpreadsheetApp.openById(props_().getProperty('DATA_ID')); ensureSheets_(ss); return ss; }\n\nfunction doGet(e) {\n  const p = (e && e.parameter) || {};\n  if (p.page === 'admin') return HtmlService.createHtmlOutput(ADMIN_HTML).setTitle('จัดการคะแนน Lucky Points').addMetaTag('viewport', 'width=device-width, initial-scale=1');\n  if (!p.action && !p.key) { // มีคนเปิดลิงก์นี้ตรงๆ (เช่น สแกน QR) — ไม่ใช่หน้าสมัครสมาชิก\n    return HtmlService.createHtmlOutput('<meta name=\"viewport\" content=\"width=device-width,initial-scale=1\"><div style=\"font-family:sans-serif;padding:24px;line-height:1.6\"><h2>ตัวเชื่อม ชำดี POS<\/h2><p>ลิงก์นี้ใช้เชื่อมแอปขายของกับ Google Sheet ของร้านเท่านั้น<br>ไม่ใช่หน้าสมัครสมาชิก<\/p><p>เจ้าของร้าน: ในแอปไปที่ การเชื่อมต่อ › ช่อง \"ลิงก์สมัครสมาชิก\" ใส่ลิงก์หน้าสมัครของ Lucky Points แทน<\/p><\/div>').setTitle('ชำดี POS');\n  }\n  return handle_(p);\n}\n/* หน้าจัดการคะแนน (เปิด URL ตัวเชื่อม + ?page=admin) — ต้องใส่รหัส POS ก่อนใช้งาน */\nfunction adminApi(p) { try { return JSON.parse(handle_(p || {}).getContent()); } catch (e) { return { ok: false, error: String(e) }; } }\nconst ADMIN_HTML = `<!doctype html><html lang=\"th\"><head><meta charset=\"utf-8\"><style>\n*{box-sizing:border-box}body{margin:0;background:#140c2c;color:#f3eeff;font:16px/1.5 system-ui,\"Noto Sans Thai\",sans-serif}\n.wrap{max-width:720px;margin:0 auto;padding:16px}h1{font-size:1.35rem;margin:6px 0 2px}.mut{color:#b9a8e6;font-size:.9rem}\n.box{background:#22174a;border:1px solid #3d2d7a;border-radius:18px;padding:14px;margin-top:12px}\ninput,select,button{font:inherit;border-radius:12px;border:1px solid #4a3a8c;background:#1a1240;color:#f3eeff;padding:10px 12px}\nbutton{cursor:pointer;background:#2f2366}button.pri{background:linear-gradient(180deg,#ff63b2,#e8157e);border:0;color:#fff;font-weight:700}\nbutton.sm{padding:7px 12px;font-size:.92rem}button:disabled{opacity:.45}.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.grow{flex:1;min-width:140px}\n.m{background:#2a1e58;border-radius:16px;padding:12px 14px;margin-top:10px}.m b.n{font-size:1.1rem}.big{font-size:1.05rem}.t{color:#ffd23f;font-weight:700}\n.edit{display:none;margin-top:10px;gap:8px;flex-direction:column}\nbutton.add{background:#1f6b4a;border-color:#2e9a6b;color:#eafff4;font-weight:700}button.sub{background:#7a2440;border-color:#b23a60;color:#ffeaf1;font-weight:700}\n.lbl{font-weight:700;margin-top:4px}.lbl.add{color:#7ff0b5}.lbl.sub{color:#ff9cbc}\n.pend{margin-top:10px;background:#3a2a10;border:1px solid #ffd23f;border-radius:14px;padding:10px 12px;display:flex;flex-direction:column;gap:8px}\n.up{color:#7ff0b5;font-weight:700}.dn{color:#ff9cbc;font-weight:700}.m.open .edit{display:flex}\n#toast{position:fixed;left:12px;right:12px;bottom:16px;background:#fff;color:#222;border-radius:12px;padding:12px;text-align:center;display:none;font-weight:600}\n<\/style><\/head><body><div class=\"wrap\">\n<h1>จัดการคะแนน / สิทธิ์ Lucky Points<\/h1><div class=\"mut\">เพิ่มสิทธิ์ ดูและแก้คะแนนสมาชิก · ทุกการแก้ไขบันทึกเป็นรายการ \"ปรับคะแนน\" ในชีต Purchases<\/div>\n<div class=\"box\" id=\"login\"><div class=\"row\"><input id=\"key\" class=\"grow\" placeholder=\"รหัส POS (ดูในแอป › การเชื่อมต่อ)\" autocomplete=\"off\"><button class=\"pri\" onclick=\"login()\">เข้าใช้งาน<\/button><\/div><div class=\"mut\" id=\"lmsg\"><\/div><\/div>\n<div id=\"app\" style=\"display:none\"><div class=\"box\"><div class=\"row\"><input id=\"q\" class=\"grow\" placeholder=\"ค้นหาชื่อ แผนก ที่ทำงาน เบอร์\" oninput=\"draw()\"><select id=\"mon\" onchange=\"load()\"><\/select><\/div><div class=\"mut\" id=\"sum\" style=\"margin-top:8px\"><\/div><\/div><div id=\"list\"><\/div><\/div>\n<\/div><div id=\"toast\"><\/div><script>\nlet KEY='',D=null,open='';const $=s=>document.querySelector(s);\nconst esc=s=>String(s==null?'':s).replace(/[&<>\"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;'}[c]));\nfunction toast(t){const e=$('#toast');e.textContent=t;e.style.display='block';clearTimeout(e._t);e._t=setTimeout(()=>e.style.display='none',2600)}\nfunction api(p){return new Promise((res,rej)=>google.script.run.withSuccessHandler(j=>j&&j.ok?res(j):rej(new Error(j&&j.error||'ผิดพลาด'))).withFailureHandler(rej).adminApi(Object.assign({key:KEY},p)))}\ntry{KEY=localStorage.getItem('lpk')||''}catch(e){}\nfunction months(){const s=$('#mon'),d=new Date(),th=['ม.ค.','ก.พ.','มี.ค.','เม.ย.','พ.ค.','มิ.ย.','ก.ค.','ส.ค.','ก.ย.','ต.ค.','พ.ย.','ธ.ค.'];let h='';for(let i=0;i<12;i++){const x=new Date(d.getFullYear(),d.getMonth()-i,1);const v=x.getFullYear()+'-'+String(x.getMonth()+1).padStart(2,'0');h+='<option value=\"'+v+'\">'+th[x.getMonth()]+' '+(x.getFullYear()+543)+(i?'':' (เดือนนี้)')+'<\/option>'}s.innerHTML=h}\nasync function login(){KEY=($('#key').value||KEY).trim();$('#lmsg').textContent='กำลังตรวจรหัส…';try{await api({action:'ping'});try{localStorage.setItem('lpk',KEY)}catch(e){}$('#login').style.display='none';$('#app').style.display='block';months();load()}catch(e){$('#lmsg').textContent='รหัสไม่ถูกต้อง: '+e.message}}\nasync function load(){$('#sum').textContent='กำลังโหลด…';try{D=await api({action:'members',month:$('#mon').value});draw()}catch(e){$('#sum').textContent=e.message}}\nconst P={};\nfunction tk(n){return Math.floor(n/D.pointsPerTicket)}\nfunction fmtN(n){return Number(n).toLocaleString()}\nfunction draw(){if(!D)return;const q=$('#q').value.trim().toLowerCase(),ppt=D.pointsPerTicket,cur=D.month===D.current;\n const L=D.members.filter(m=>!q||[m.nickname,m.department,m.workplace,m.contact].join(' ').toLowerCase().includes(q)).sort((a,b)=>b.points-a.points);\n const tp=D.members.reduce((a,m)=>a+m.points,0),tt=D.members.reduce((a,m)=>a+tk(m.points),0);\n $('#sum').textContent=D.members.length+' คน · '+fmtN(tp)+' คะแนน · '+tt+' สิทธิ์ · '+ppt+' คะแนน = 1 สิทธิ์'+(cur?'':' · ดูย้อนหลังอย่างเดียว');\n $('#list').innerHTML=L.map(m=>{const id=esc(m.id),d=P[m.id]||0,nw=Math.max(0,m.points+d);\n  let h='<div class=\"m'+(open===m.id?' open':'')+'\" data-id=\"'+id+'\"><b class=\"n\">'+esc(m.nickname)+'<\/b><div class=\"mut\">'+esc([m.department,m.workplace,m.contact].filter(Boolean).join(' · '))+'<\/div><div class=\"big\">'+fmtN(m.points)+' คะแนน = <span class=\"t\">'+tk(m.points)+' สิทธิ์<\/span><\/div>';\n  if(cur){h+='<div class=\"row\" style=\"margin-top:8px\"><button class=\"sm add\" data-a=\"t+\">+1 สิทธิ์<\/button><button class=\"sm sub\" data-a=\"t-\">−1 สิทธิ์<\/button><button class=\"sm\" data-a=\"tog\">'+(open===m.id?'ปิด ▴':'แก้คะแนน ▾')+'<\/button><\/div>'+\n   '<div class=\"edit\"><div class=\"lbl add\">➕ เพิ่มคะแนน<\/div><div class=\"row\"><input class=\"grow\" type=\"number\" inputmode=\"numeric\" min=\"1\" data-f=\"add\" placeholder=\"เช่น 50\"><button class=\"sm add\" data-a=\"add\">เพิ่ม<\/button><\/div>'+\n   '<div class=\"lbl sub\">➖ ลดคะแนน<\/div><div class=\"row\"><input class=\"grow\" type=\"number\" inputmode=\"numeric\" min=\"1\" data-f=\"sub\" placeholder=\"เช่น 50\"><button class=\"sm sub\" data-a=\"sub\">ลด<\/button><\/div>'+\n   '<div class=\"lbl\">✏️ ตั้งคะแนนใหม่ทั้งหมด<\/div><div class=\"row\"><input class=\"grow\" type=\"number\" inputmode=\"numeric\" min=\"0\" data-f=\"set\" placeholder=\"คะแนนที่ถูกต้อง\"><button class=\"sm\" data-a=\"set\">ตั้งค่า<\/button><\/div><\/div>';\n   if(d){h+='<div class=\"pend\"><div>จะเปลี่ยนเป็น <b>'+fmtN(nw)+' คะแนน = '+tk(nw)+' สิทธิ์<\/b> <span class=\"'+(d>0?'up':'dn')+'\">('+(d>0?'+':'')+fmtN(d)+')<\/span><\/div><input data-f=\"note\" placeholder=\"เหตุผล (ไม่บังคับ) เช่น ลืมสแกน\"><div class=\"row\"><button class=\"pri grow\" data-a=\"save\">💾 บันทึก<\/button><button data-a=\"cancel\">ยกเลิก<\/button><\/div><\/div>'}}\n  return h+'<\/div>'}).join('')||'<div class=\"m mut\">ไม่พบสมาชิก<\/div>'}\nfunction stage(id,delta){const m=D.members.find(x=>x.id===id);let d=(P[id]||0)+delta;if(m.points+d<0)d=-m.points;P[id]=d;if(!d)delete P[id];draw();const el=document.querySelector('.m[data-id=\"'+CSS.escape(id)+'\"] .pend');if(el)el.scrollIntoView({block:'nearest',behavior:'smooth'})}\ndocument.addEventListener('click',async e=>{const b=e.target.closest('[data-a]');if(!b)return;const card=b.closest('.m');const id=card&&card.dataset.id;if(!id)return;const m=D.members.find(x=>x.id===id),ppt=D.pointsPerTicket,a=b.dataset.a;\n const val=f=>Math.floor(+((card.querySelector('[data-f=\"'+f+'\"]')||{}).value||0));\n if(a==='tog'){open=open===id?'':id;draw();return}\n if(a==='t+')return stage(id,ppt);if(a==='t-')return stage(id,-ppt);\n if(a==='add'){const n=val('add');if(n<=0)return toast('ใส่จำนวนที่จะเพิ่ม');return stage(id,n)}\n if(a==='sub'){const n=val('sub');if(n<=0)return toast('ใส่จำนวนที่จะลด');return stage(id,-n)}\n if(a==='set'){const raw=(card.querySelector('[data-f=\"set\"]')||{}).value;if(raw==='')return toast('ใส่คะแนนที่ถูกต้อง');P[id]=0;return stage(id,Math.max(0,Math.floor(+raw))-m.points)}\n if(a==='cancel'){delete P[id];draw();return}\n if(a==='save'){const d=P[id]||0;if(!d)return;const target=Math.max(0,m.points+d);const note=((card.querySelector('[data-f=\"note\"]')||{}).value||'').trim()||((d>0?'เพิ่ม ':'ลด ')+Math.abs(d)+' คะแนน');\n  b.disabled=true;b.textContent='กำลังบันทึก…';try{const j=await api({action:'adjust',memberId:id,target:target,note:note});m.points=j.points;delete P[id];open='';draw();toast('บันทึกแล้ว ✓ '+m.nickname+' '+fmtN(j.points)+' คะแนน = '+tk(j.points)+' สิทธิ์')}catch(err){b.disabled=false;b.textContent='💾 บันทึก';toast('ไม่สำเร็จ: '+err.message)}}});\nif(KEY){$('#key').value=KEY;login()}\n<\/script><\/body><\/html>`;\nfunction doPost(e) { let p = {}; try { p = JSON.parse(e.postData.contents); } catch (x) {} return handle_(p); }\nfunction out_(o) { return ContentService.createTextOutput(JSON.stringify(o)).setMimeType(ContentService.MimeType.JSON); }\n\n/* ---------- Lucky Points helpers ---------- */\nfunction msheet_(name) { return SpreadsheetApp.openById(MEMBER_SHEET_ID).getSheetByName(name); }\nfunction rows_(name) {\n  const v = msheet_(name).getDataRange().getValues();\n  const h = v.shift().map(String);\n  return v.map(r => { const o = {}; h.forEach((k, i) => o[k] = r[i]); return o; });\n}\nfunction fmt_(d, f) { return Utilities.formatDate(d, TZ, f); }\nfunction thisMonth_() { return fmt_(new Date(), 'yyyy-MM'); }\nfunction monthOf_(v) { return v instanceof Date ? fmt_(v, 'yyyy-MM') : String(v).slice(0, 7); }\nfunction now_() { return fmt_(new Date(), 'yyyy-MM-dd HH:mm'); }\nfunction settings_() {\n  const o = {}; rows_('Settings').forEach(r => o[r.key] = r.value);\n  return { shopName: String(o.shopName || ''), pointsPerTicket: Number(o.pointsPerTicket) || 300 };\n}\nfunction monthPoints_(month) {\n  const m = month || thisMonth_(), pts = {};\n  rows_('Purchases').forEach(r => {\n    if (String(r.status) === 'approved' && monthOf_(r.month) === m) pts[r.memberId] = (pts[r.memberId] || 0) + (Number(r.amount) || 0);\n  });\n  return pts;\n}\nfunction withLock_(fn) { const l = LockService.getScriptLock(); l.waitLock(20000); try { return fn(); } finally { l.releaseLock(); } }\n\nfunction handle_(p) {\n  const key = props_().getProperty('POS_KEY');\n  if (!key || String(p.key) !== key) return out_({ ok: false, error: 'รหัส POS ไม่ถูกต้อง' });\n  try {\n    switch (p.action) {\n      /* ----- common ----- */\n      case 'ping': {\n        let lucky = null; try { lucky = settings_(); } catch (e) {}\n        return out_({ ok: true, shopName: lucky ? lucky.shopName : '', pointsPerTicket: lucky ? lucky.pointsPerTicket : 300, month: thisMonth_(), lucky: !!lucky, sync: true, epoch: props_().getProperty('EPOCH') || '' });\n      }\n      /* ----- multi-device sync ----- */\n      case 'register': return withLock_(() => {\n        const n = Number(props_().getProperty('DEV_COUNT') || 0) + 1;\n        props_().setProperty('DEV_COUNT', String(n));\n        return out_({ ok: true, dev: n });\n      });\n      case 'seed': return withLock_(() => {\n        const ss = data_(), snap = ss.getSheetByName('Snapshot'), ops = ss.getSheetByName('Ops');\n        const txt = String(p.snapshot || '');\n        if (!txt) return out_({ ok: false, error: 'ไม่มีข้อมูล' });\n        snap.clear();\n        const rows = [['chunk']];\n        for (let i = 0; i < txt.length; i += CHUNK) rows.push([txt.slice(i, i + CHUNK)]);\n        snap.getRange(1, 1, rows.length, 1).setNumberFormat('@').setValues(rows);\n        ops.clear(); ops.appendRow(['id', 'time', 'device', 'type', 'parts', 'data']);\n        const ep = Utilities.getUuid().slice(0, 8);\n        props_().setProperty('EPOCH', ep); props_().setProperty('SNAP_CURSOR', '0');\n        return out_({ ok: true, epoch: ep, cursor: 0 });\n      });\n      case 'snapshot': {\n        const s = data_().getSheetByName('Snapshot'), n = s.getLastRow();\n        const txt = n > 1 ? s.getRange(2, 1, n - 1, 1).getValues().map(r => String(r[0])).join('') : '';\n        return out_({ ok: true, epoch: props_().getProperty('EPOCH') || '', cursor: Number(props_().getProperty('SNAP_CURSOR') || 0), data: txt });\n      }\n      case 'push': {\n        const ep = props_().getProperty('EPOCH') || '';\n        if (!ep || String(p.epoch) !== ep) return out_({ ok: false, error: 'epoch', epoch: ep });\n        const list = Array.isArray(p.ops) ? p.ops : [];\n        return withLock_(() => {\n          const sh = data_().getSheetByName('Ops'), last = sh.getLastRow();\n          const from = Math.max(2, last - 3000);\n          const seen = new Set(last >= 2 ? sh.getRange(from, 1, last - from + 1, 1).getValues().map(r => String(r[0])) : []);\n          const rows = []; let w = 6;\n          list.forEach(o => {\n            if (!o || seen.has(String( function totals() {
    const sub = r2(cart.items.reduce((a, x) => a + x.qty * x.price, 0));
    const cost = r2(cart.items.reduce((a, x) => a + x.qty * x.cost, 0));
    let disc = 0, discName = '';
    const d = cart.discId ? S.discounts.find(x => x.id === cart.discId) : null;
    if (d) {
        disc = d.type === 'pct' ? r2(sub * d.value / 100) : d.value;
        discName = d.name;
    }
    else if (cart.man) {
        disc = cart.manType === 'pct' ? r2(sub * cart.man / 100) : cart.man;
        discName = cart.manType === 'pct' ? `ส่วนลด ${cart.man}%` : 'ส่วนลด';
    }
    disc = Math.min(disc, sub);
    const c = cart.cid ? C(cart.cid) : null;
    let ptsDisc = 0, ptsUsed = 0;
    if (c && cart.usePts && c.points > 0 && S.settings.pointBaht > 0 && !(c.lid && Lucky.on())) {
        const pb = S.settings.pointBaht;
        ptsDisc = Math.min(r2(c.points * pb), r2(sub - disc));
        ptsUsed = Math.ceil(ptsDisc / pb - 1e-9);
    }
    const base = Math.max(0, r2(sub - disc - ptsDisc));
    const tx = S.settings.tax;
    let tax = 0, total = base;
    if (tx.on && tx.rate > 0) {
        if (tx.mode === 'add') {
            tax = r2(base * tx.rate / 100);
            total = r2(base + tax);
        }
        else
            tax = r2(base * tx.rate / (100 + tx.rate));
    }
    const qty = cart.items.reduce((a, x) => a + x.qty, 0);
    return { sub, cost, disc, discName, ptsDisc, ptsUsed, tax, total, qty, taxOn: tx.on && tx.rate > 0 };
}

/* ---------- find duplicate imports ---------- */
function findDups() {
    const out = [], seen = new Map(), seen2 = new Map(), lvDays = new Set();
    for (const s of S.sales) {
        if (!s.ext)
            continue;
        const e = String(s.ext);
        if (seen.has(e)) {
            out.push({ s, why: 'นำเข้าซ้ำ (เลขเดียวกัน)' });
            continue;
        }
        seen.set(e, s);
        if (e.startsWith('lv:')) {
            const k = String(s.extNo || '') + '@' + s.t + '@' + (s.refunded ? 1 : 0);
            if (s.extNo && seen2.has(k)) {
                out.push({ s, why: 'ใบเสร็จ Loyverse ซ้ำ (เลขและเวลาเดียวกัน)' });
                continue;
            }
            seen2.set(k, s);
            lvDays.add(dkey(s.t));
        }
    }
    const ids = new Set(out.map(x => x.s.id));
    for (const s of S.sales)
        if (s.lvDay && !s.compact && !ids.has(s.id) && lvDays.has(dkey(s.t)))
            out.push({ s, why: 'ยอดรายวันซ้ำกับใบเสร็จวันเดียวกัน' });
    return out;
}
function dupCard() {
    const D = findDups();
    const amt = D.reduce((a, x) => a + (x.s.refunded ? 0 : x.s.total), 0);
    return `<div class="card" style="display:flex;flex-direction:column;gap:10px"><b>ตรวจหาข้อมูลนำเข้าซ้ำ</b>
   <span class="small muted">ใช้เมื่อนำเข้าไฟล์ Loyverse ทับกันหลายรอบ แล้วยอดไม่ตรงกับ Loyverse</span>
   ${D.length ? `<div class="small" style="background:var(--sunk);border-radius:10px;padding:8px 10px">เจอ <b>${D.length.toLocaleString('th-TH')} รายการซ้ำ</b> ยอดรวม ${fmt(amt)}<br>${[...new Set(D.map(x => x.why))].map(w => '· ' + w + ' ' + D.filter(x => x.why === w).length + ' รายการ').join('<br>')}</div><button class="btn danger" data-act="dupFix" style="align-self:flex-start">ลบรายการซ้ำ ${D.length.toLocaleString('th-TH')} รายการ</button>` : '<div class="small" style="color:var(--good,#2E9B4F)">✓ ไม่พบข้อมูลซ้ำ</div>'}</div>`;
}

    const ys = [...new Set([...years, 2021, 2022, 2023, 2024, 2025, new Date().getFullYear()])].sort();
