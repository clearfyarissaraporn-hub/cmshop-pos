<title>ถั่วงอก Money</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Mali:wght@500;600;700&family=IBM+Plex+Sans+Thai:wght@400;500;600&display=swap">
<style>
/* Layout: one phone-width column, sticky month header, bottom tab bar, bottom sheets for every form */
/* Pastel minimal: cream paper ground, soft pink + sky-blue accents, mint for "money is OK" */
:root{
  --bg:#FFF8F0; --bg2:#FFFDF9; --surface:#FFFFFF; --surface2:#F7EEF1; --ink:#3B3350; --muted:#857C98; --line:#F0E3E8;
  --accent:#F07A9C; --accent-soft:#FFE4EC;
  --sprout:#38A57E; --sprout-soft:#DDF3E9; --peach:#EE7396; --peach-soft:#FFE5ED; --sun:#DE9C2E; --sun-soft:#FFF0D3;
  --sky:#5E9BE0; --sky-soft:#E2EFFC; --lilac:#9C82DB; --lilac-soft:#EFE8FB;
  --blush:#FF9EB5; --good:#2E9C72; --warn:#C98512; --bad:#D9486A;
  --shadow:0 1px 2px rgba(120,80,100,.06),0 6px 18px rgba(120,80,110,.07);
  --f-display:"Mali","IBM Plex Sans Thai",system-ui,sans-serif;
  --f-body:"IBM Plex Sans Thai",system-ui,-apple-system,"Segoe UI",sans-serif;
  --r:18px; color-scheme:light;
}
*{box-sizing:border-box}
html,body{background:var(--bg);color:var(--ink)}
body{background:radial-gradient(70% 45% at 85% 0%,rgba(255,214,228,.9) 0%,transparent 70%),radial-gradient(60% 40% at 0% 20%,rgba(205,226,255,.9) 0%,transparent 70%),linear-gradient(180deg,#DCEBFF 0%,#EEF0FF 28%,#FFE9F1 62%,#FFF8F0 100%) fixed;min-height:100%}
#sky{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden}
#sky i{position:absolute;border-radius:50%;background:#fff;box-shadow:0 0 6px rgba(255,255,255,.9)}
#sky b{position:absolute;font-weight:400;line-height:1;text-shadow:0 0 8px currentColor}
#sky .cloud{position:absolute;border-radius:999px;background:#fff;opacity:.7;filter:blur(2px)}
#sky .cloud:before,#sky .cloud:after{content:"";position:absolute;background:#fff;border-radius:50%}
#sky .cloud:before{width:45%;height:150%;left:15%;top:-60%}#sky .cloud:after{width:35%;height:120%;left:50%;top:-40%}
#sky svg{position:absolute;opacity:.45}
#sky .shoot{position:absolute;width:120px;height:2px;background:linear-gradient(90deg,#F5BE4B,transparent);border-radius:2px;opacity:0;transform:rotate(-20deg)}
@media (prefers-reduced-motion:no-preference){#sky i,#sky b{animation:tw var(--d,3s) ease-in-out infinite;animation-delay:var(--dl,0s)}#sky .cloud{animation:drift 60s linear infinite alternate}@keyframes drift{to{transform:translateX(40px)}}@keyframes tw{50%{opacity:.25;transform:scale(.6)}}
#sky .shoot{animation:shoot 9s linear infinite;animation-delay:var(--dl,2s)}@keyframes shoot{0%{opacity:0;translate:0 0}3%{opacity:1}10%{opacity:0;translate:-340px 120px}100%{opacity:0;translate:-340px 120px}}}
header.top,main.wrap{position:relative;z-index:1}
body{font-family:var(--f-body);font-size:15px;line-height:1.55;-webkit-tap-highlight-color:transparent}
button,input,select,textarea{font:inherit;color:inherit}
.num{font-variant-numeric:tabular-nums}
.wrap{max-width:600px;margin:0 auto;padding-inline:16px;padding-block:0 120px}
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:linear-gradient(180deg,rgba(220,235,255,.85),rgba(220,235,255,.55));backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}
.top-in{max-width:600px;margin:0 auto;padding:10px 16px;display:flex;align-items:center;gap:10px}
.brand{display:flex;align-items:center;gap:8px;white-space:nowrap;overflow:hidden;font-family:var(--f-display);font-weight:700;font-size:19px;flex:1;min-width:0}
.brand svg{width:34px;height:34px;flex:none}
.monthsw{display:flex;align-items:center;gap:2px;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:2px}
.monthsw button{border:0;background:none;width:32px;height:32px;border-radius:50%;cursor:pointer;font-size:18px;color:var(--muted)}
.monthsw button:hover{background:var(--surface2)}
.monthsw span{min-width:64px;text-align:center;font-weight:600;font-size:14px}
h1,h2,h3{font-family:var(--f-display);text-wrap:balance;margin:0;font-weight:700}
h2{font-size:18px} h3{font-size:16px}
.sec{margin-top:22px;display:grid;gap:10px}
.sec-h{display:flex;align-items:baseline;justify-content:space-between;gap:8px}
.sec-h small{color:var(--muted)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);padding:16px}
.muted{color:var(--muted)} .small{font-size:13px} .tiny{font-size:12px}
.row{display:flex;align-items:center;gap:10px} .row>.grow{flex:1;min-width:0}
.between{justify-content:space-between}
.stack{display:grid;gap:8px}
.chip{display:inline-flex;align-items:center;gap:6px;padding:3px 10px;border-radius:999px;font-size:12px;font-weight:600;background:var(--surface2);color:var(--muted);white-space:nowrap}
.chip.good{background:var(--sprout-soft);color:var(--good)} .chip.warn{background:var(--sun-soft);color:var(--warn)} .chip.bad{background:var(--peach-soft);color:var(--bad)}
.dot{width:10px;height:10px;border-radius:50%;flex:none;display:inline-block}
.btn{border:0;border-radius:12px;padding:10px 16px;font-weight:600;cursor:pointer;background:var(--ink);color:var(--bg);display:inline-flex;align-items:center;justify-content:center;gap:6px}
.btn.soft{background:var(--surface2);color:var(--ink)} .btn.green{background:var(--accent);color:#fff} .btn.danger{background:var(--peach-soft);color:var(--bad)}
.btn.sm{padding:6px 12px;font-size:13px;border-radius:10px}
.btn:focus-visible,.tab:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--sprout);outline-offset:2px}
.linkbtn{border:0;background:none;color:var(--sprout);font-weight:600;cursor:pointer;padding:0}
/* hero */
.hero{display:grid;grid-template-columns:96px 1fr;gap:12px;align-items:center}
.hero svg{width:96px;height:96px}
.bubble{background:var(--surface2);border-radius:16px 16px 16px 4px;padding:10px 12px;font-size:14px}
.bubble b{font-family:var(--f-display)}
.kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.kpi{background:var(--surface);border-radius:14px;padding:10px 12px;box-shadow:var(--shadow);min-width:0}
.kpi .l{font-size:12px;color:var(--muted)} .kpi .v{font-weight:600;font-size:17px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.safe{display:flex;align-items:center;justify-content:space-between;gap:12px;background:var(--sprout-soft);border-radius:var(--r);padding:14px 16px}
.safe .v{font-family:var(--f-display);font-size:26px;font-weight:700;color:var(--sprout)}
.safe.neg{background:var(--peach-soft)} .safe.neg .v{color:var(--bad)}
.bar{height:8px;border-radius:99px;background:var(--surface2);overflow:hidden;position:relative}
.bar i{display:block;height:100%;border-radius:99px}
.bar.over i{background:var(--bad)!important}
.grp{display:grid;gap:6px}
.grp .top{display:flex;justify-content:space-between;gap:8px;font-size:14px}
.ins{display:grid;grid-template-columns:4px 1fr;gap:12px;padding:12px 14px;border-radius:14px;background:var(--surface);box-shadow:var(--shadow)}
.ins:before{content:"";border-radius:4px;background:var(--muted)}
.ins.bad:before{background:var(--bad)} .ins.warn:before{background:var(--warn)} .ins.good:before{background:var(--good)}
.ins b{display:block;font-size:14px} .ins p{margin:2px 0 0;font-size:13px;color:var(--muted)}
.list{display:grid;border:1px solid var(--line);background:var(--surface);border-radius:var(--r);box-shadow:var(--shadow);overflow:hidden}
.li{display:flex;align-items:center;gap:12px;padding:12px 14px;border-top:1px solid var(--line);cursor:pointer;background:none;border-left:0;border-right:0;border-bottom:0;text-align:left;width:100%}
.li:first-child{border-top:0}
.li:hover{background:var(--surface2)}
.li .t{flex:1;min-width:0}
.li .t b{display:block;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.li .t span{font-size:12px;color:var(--muted)}
.amt{font-weight:600;white-space:nowrap}
.amt.in{color:var(--good)} .amt.out{color:var(--ink)}
.dayh{font-size:12px;color:var(--muted);padding:12px 4px 4px;display:flex;justify-content:space-between}
.ic{width:34px;height:34px;border-radius:11px;display:grid;place-items:center;font-family:var(--f-display);font-weight:700;font-size:14px;flex:none}
.seg{display:flex;background:var(--surface2);border-radius:12px;padding:3px;gap:3px;overflow-x:auto}
.seg button,.seg label{flex:1;border:0;background:none;padding:8px 10px;border-radius:9px;cursor:pointer;font-weight:600;font-size:14px;color:var(--muted);white-space:nowrap;text-align:center}
.seg .on,.seg input:checked+span{background:var(--surface);color:var(--ink);box-shadow:var(--shadow)}
.seg label{padding:0;display:flex} .seg label span{flex:1;padding:8px 10px;border-radius:9px}
.seg input{position:absolute;opacity:0;pointer-events:none}
.ent{display:grid;gap:10px}
.ent .head{display:flex;align-items:flex-start;gap:10px}
.ent .big{font-family:var(--f-display);font-size:22px;font-weight:700}
.meta{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:13px;color:var(--muted)}
.meta b{color:var(--ink);font-weight:600}
.empty{text-align:center;padding:24px 16px;display:grid;gap:10px;justify-items:center}
.empty svg{width:90px;height:90px}
.banner{display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap;background:var(--sun-soft);color:var(--ink);border-radius:14px;padding:10px 14px;margin-top:12px;font-size:14px}
/* nav */
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
.tabs-in{max-width:600px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr)}
.tab{border:0;background:none;padding:8px 2px 10px;display:grid;justify-items:center;gap:2px;font-size:11px;color:var(--muted);cursor:pointer}
.tab svg{width:22px;height:22px}
.tab.on{color:var(--accent);font-weight:600}
.fab{position:fixed;z-index:31;right:max(16px,calc(50% - 284px));bottom:calc(76px + env(safe-area-inset-bottom,0px));width:56px;height:56px;border-radius:20px;border:0;background:var(--accent);color:#fff;font-size:30px;line-height:1;box-shadow:0 6px 18px rgba(240,122,156,.35);color:#fff;cursor:pointer}
/* sheet */
.overlay{position:fixed;inset:0;z-index:50;background:rgba(60,40,70,.35);display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--bg2);border-top:1px solid var(--line);width:100%;max-width:600px;max-height:92vh;overflow:auto;border-radius:22px 22px 0 0;padding:8px 16px calc(20px + env(safe-area-inset-bottom,0px))}
.grab{width:40px;height:5px;border-radius:9px;background:var(--line);margin:4px auto 10px}
.sheet h2{margin-bottom:12px}
form.f{display:grid;gap:12px}
.fld{display:grid;gap:4px} .fld>span{font-size:13px;color:var(--muted);font-weight:500}
.fld input,.fld select,.fld textarea{width:100%;border:1px solid var(--line);background:var(--bg2);border-radius:12px;padding:10px 12px;min-width:0}
.fld input.amtin{font-size:26px;font-weight:600;font-family:var(--f-display);padding:8px 12px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.two>*{min-width:0}
.hint{font-size:12px;color:var(--muted)}
.actions{display:flex;gap:8px;justify-content:space-between;flex-wrap:wrap;margin-top:4px}
.chk{display:flex;gap:8px;align-items:center;font-size:14px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(140px + env(safe-area-inset-bottom,0px));z-index:60;background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;font-size:14px;box-shadow:var(--shadow)}
/* charts */
.chart svg{width:100%;height:auto;display:block}
.chart text{fill:var(--muted);font-size:11px;font-family:var(--f-body)}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:12px;color:var(--muted)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.step{display:grid;grid-template-columns:28px 1fr auto;gap:10px;align-items:center;padding:10px 0;border-top:1px solid var(--line)}
.step:first-child{border-top:0}
.step .n{width:28px;height:28px;border-radius:50%;background:var(--peach-soft);color:var(--peach);display:grid;place-items:center;font-weight:700;font-size:13px}
.tbl{overflow-x:auto}
.tbl table{border-collapse:collapse;width:100%;font-size:13px;min-width:420px}
.tbl th,.tbl td{padding:7px 8px;border-bottom:1px solid var(--line);text-align:right;white-space:nowrap}
.tbl th:first-child,.tbl td:first-child{text-align:left}
.tbl th{color:var(--muted);font-weight:500}
.guide{display:grid;gap:10px}
details.g{background:var(--surface);border-radius:var(--r);box-shadow:var(--shadow);padding:0 16px}
details.g summary{cursor:pointer;padding:14px 0;font-weight:600;list-style:none;display:flex;justify-content:space-between;gap:8px}
details.g summary::-webkit-details-marker{display:none}
details.g summary:after{content:"+";color:var(--muted);font-size:18px}
details.g[open] summary:after{content:"–"}
details.g .body{padding-bottom:14px;font-size:14px}
details.g ol,details.g ul{margin:0;padding-left:20px;display:grid;gap:4px}
.sw{display:flex;gap:10px;flex-wrap:wrap}
.sw button{width:36px;height:36px;border-radius:50%;border:3px solid transparent;cursor:pointer}
.sw button.on{border-color:var(--ink)}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chips button{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 12px;cursor:pointer;font-size:13px}
.chips button.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.stickers{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.stickers div{background:var(--surface2);border-radius:14px;padding:6px;text-align:center;font-size:12px;color:var(--muted)}
.stickers svg{width:100%;height:auto}
.studio{display:grid;grid-template-columns:150px 1fr;gap:16px;align-items:center}
.studio>svg{width:150px;height:150px}
/* 3D neon stage */
.stage{--glow:#5ED6A6;position:relative;overflow:hidden;display:grid;grid-template-columns:112px 1fr;gap:14px;align-items:center;padding:14px;border-radius:22px;color:var(--ink);
  background:radial-gradient(1.5px 1.5px at 20% 25%,#fff 99%,transparent),radial-gradient(2px 2px at 62% 18%,#fff 99%,transparent),radial-gradient(1.5px 1.5px at 82% 62%,#fff 99%,transparent),radial-gradient(2px 2px at 45% 78%,#FFF3C4 99%,transparent),radial-gradient(1.5px 1.5px at 92% 30%,#fff 99%,transparent),linear-gradient(135deg,#CFE2FF 0%,#E7E3FF 45%,#FFDCE8 100%);box-shadow:var(--shadow)}
.stage:before{content:"";position:absolute;width:140px;height:140px;left:-40px;bottom:-60px;border-radius:50%;background:radial-gradient(circle,rgba(255,255,255,.9),transparent 70%);pointer-events:none}
.stage:after{content:"";position:absolute;width:160px;height:160px;right:-50px;top:-70px;border-radius:50%;background:radial-gradient(circle,rgba(150,195,255,.45),transparent 70%);pointer-events:none}
.stage.mood-party{--glow:#F5BE4B}.stage.mood-worried{--glow:#F07A9C}
.stage-av{position:relative;z-index:1;width:112px;height:112px;border:0;padding:0;background:none;cursor:pointer;display:block}
.av-anim{display:block;width:100%;height:100%;border-radius:24px;overflow:hidden;box-shadow:0 0 0 2px var(--glow),0 0 24px var(--glow);background:#fff}
.av-anim svg{width:100%;height:100%;display:block}
.spk{position:absolute;color:var(--glow);font-style:normal;font-size:13px;pointer-events:none;text-shadow:0 0 8px var(--glow)}
.spk.k1{top:-8px;right:-6px}.spk.k2{bottom:6px;left:-10px;font-size:10px}.spk.k3{top:30%;right:-14px;font-size:11px}
.burst{position:absolute;left:50%;top:40%;font-style:normal;color:#F07A9C;font-size:14px;pointer-events:none;opacity:0}
.motion-demo{display:grid;place-items:center;padding:16px 0 6px}
.motion-demo .av-anim{width:130px;height:130px;--glow:#F4A9C0}
.eyes{transform-box:view-box;transform-origin:100px 116px}
@media (prefers-reduced-motion:no-preference){
 .anim-float{animation:mfloat 3.2s ease-in-out infinite}@keyframes mfloat{50%{transform:translateY(-7px)}}
 .anim-breathe{animation:mbreathe 2.8s ease-in-out infinite}@keyframes mbreathe{50%{transform:scale(1.05)}}
 .anim-sway{animation:msway 3s ease-in-out infinite;transform-origin:50% 100%}@keyframes msway{25%{transform:rotate(-4deg)}75%{transform:rotate(4deg)}}
 .anim-bounce{animation:mbounce 1.6s cubic-bezier(.3,0,.3,1) infinite;transform-origin:50% 100%}@keyframes mbounce{0%,100%{transform:translateY(0) scale(1)}30%{transform:translateY(-10px) scale(.98,1.03)}55%{transform:translateY(0) scale(1.04,.96)}}
 .mood-worried .stage-av{animation:mshake 5s ease-in-out infinite}@keyframes mshake{0%,88%,100%{transform:none}90%{transform:translateX(-3px)}92%{transform:translateX(3px)}94%{transform:translateX(-2px)}96%{transform:translateX(2px)}}
 .mood-party .stage-av{animation:mhop 2.4s ease-in-out infinite}@keyframes mhop{0%,70%,100%{transform:none}80%{transform:translateY(-8px) rotate(-6deg)}90%{transform:translateY(0) rotate(4deg)}}
 .stage-av.poke{animation:mjump .6s cubic-bezier(.3,1.4,.5,1)}@keyframes mjump{40%{transform:translateY(-18px) rotate(-5deg) scale(1.04)}70%{transform:translateY(0) scale(1.06,.94)}}
 .spk{animation:tw 2.2s ease-in-out infinite}.spk.k2{animation-delay:.7s}.spk.k3{animation-delay:1.4s}
 .burst{animation:mburst .9s ease-out forwards}@keyframes mburst{0%{opacity:1;transform:translate(-50%,-50%) rotate(var(--a)) translateY(0)}100%{opacity:0;transform:translate(-50%,-50%) rotate(var(--a)) translateY(-70px)}}
 .eyes{animation:mblink 4.6s infinite}@keyframes mblink{0%,93%,100%{transform:scaleY(1)}95%{transform:scaleY(.12)}}
}
/* analysis */
.lvl{font-size:12px;letter-spacing:.04em;color:var(--lilac);font-weight:600}
.nw{display:grid;grid-template-columns:56px 1fr auto;gap:10px;align-items:center;font-size:13px}
.nwbar{height:14px;border-radius:99px;background:var(--surface2);overflow:hidden}.nwbar i{display:block;height:100%;border-radius:99px;min-width:3px}
.wf{display:grid;grid-template-columns:minmax(0,200px) 1fr;gap:14px;align-items:center}
.waffle{width:100%;height:auto;max-width:200px}
.wl{display:grid;gap:4px;min-width:0}
.wli{display:grid;grid-template-columns:10px 1fr auto;gap:8px;align-items:center;border:0;background:none;padding:6px 4px;border-radius:8px;cursor:pointer;text-align:left;font-size:13px}
.wli:hover{background:var(--surface2)}
.stackbar{display:flex;height:18px;border-radius:99px;overflow:hidden;gap:2px}.stackbar i{display:block;min-width:4px}
.stars{display:flex;gap:4px;flex-wrap:wrap}.st{width:24px;height:24px;fill:var(--surface2)}.st.on{fill:#F5BE4B}
.cmp{display:flex;align-items:center;gap:8px;font-size:14px;flex-wrap:wrap}.cmp .grow{flex:1;min-width:80px}
.topc{display:flex;gap:10px;align-items:center;border:0;background:none;padding:4px 0;cursor:pointer;text-align:left;width:100%}.topc .grow{flex:1;min-width:0;display:grid;gap:4px}
.rank{width:24px;height:24px;border-radius:50%;background:var(--surface2);display:grid;place-items:center;font-size:12px;font-weight:700;color:var(--lilac);flex:none}
.crumbs{display:flex;align-items:center;gap:6px;flex-wrap:wrap;font-size:14px}.crumbs button{border:0;background:var(--surface2);color:var(--ink);border-radius:999px;padding:4px 12px;cursor:pointer}.crumbs i{color:var(--muted);font-style:normal}.crumbs span{font-weight:600}
.calg{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}.calg>i{font-style:normal;text-align:center;font-size:11px;color:var(--muted)}

  --accent:#FF5FCB; --accent-soft:#4E2370; --cyan:#62E8FF;
  --sprout:#6FF3C6; --sprout-soft:#1F4A5A; --peach:#FF79B8; --peach-soft:#4D2266; --sun:#FFE066; --sun-soft:#4A3A3A;
  --sky:#7FC8FF; --sky-soft:#22356F; --lilac:#C49BFF; --lilac-soft:#3A2878;
  --good:#6FF3C6; --warn:#FFE066; --bad:#FF6F9B;

}

<script>"use strict";
/* ========== utils ========== */
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,8);
const TH_M=['ม.ค.','ก.พ.','มี.ค.','เม.ย.','พ.ค.','มิ.ย.','ก.ค.','ส.ค.','ก.ย.','ต.ค.','พ.ย.','ธ.ค.'];
const TH_MF=['มกราคม','กุมภาพันธ์','มีนาคม','เมษายน','พฤษภาคม','มิถุนายน','กรกฎาคม','สิงหาคม','กันยายน','ตุลาคม','พฤศจิกายน','ธันวาคม'];
const TH_D=['อาทิตย์','จันทร์','อังคาร','พุธ','พฤหัสบดี','ศุกร์','เสาร์'];
const pad=n=>String(n).padStart(2,'0');
const ymd=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const todayStr=()=>ymd(new Date());
const parse=s=>{const[y,m,d]=String(s).split('-').map(Number);return new Date(y,(m||1)-1,d||1)};
const fmtDate=s=>{const d=parse(s);return d.getDate()+' '+TH_M[d.getMonth()]+' '+String(d.getFullYear()+543).slice(2)};
const fmtMonth=(y,m)=>TH_M[m]+' '+String(y+543).slice(2);
const money=(n,dec=0)=>{n=Number(n)||0;return n.toLocaleString('th-TH',{minimumFractionDigits:dec,maximumFractionDigits:dec})};
const baht=n=>'฿'+money(Math.round(n));
const sum=(a,f=t=>t.amount)=>a.reduce((s,t)=>s+(Number(f(t))||0),0);
const addMonths=(s,k)=>{const d=parse(s);const day=d.getDate();d.setDate(1);d.setMonth(d.getMonth()+k);const last=new Date(d.getFullYear(),d.getMonth()+1,0).getDate();d.setDate(Math.min(day,last));return ymd(d)};
const daysBetween=(a,b)=>Math.round((parse(b)-parse(a))/864e5);
const monthBounds=(y,m)=>[ymd(new Date(y,m,1)),ymd(new Date(y,m+1,0))];
const num=v=>{const n=parseFloat(String(v??'').replace(/,/g,''));return isFinite(n)?n:0};
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));

/* ========== storage: IndexedDB (falls back to memory) ========== */
const STORES=['tx','debts','cards','invs','ins','goals','recur','meta','media'];
let DBNAME='tuangok-money';
let idb=null;const mem={};STORES.forEach(s=>mem[s]=new Map());
const rq=r=>new Promise((res,rej)=>{r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)});
function openDB(){return new Promise(res=>{try{
  const r=indexedDB.open(DBNAME,2);
  r.onupgradeneeded=()=>{const d=r.result;
    if(!d.objectStoreNames.contains('tx')){const t=d.createObjectStore('tx',{keyPath:'id'});t.createIndex('date','date');t.createIndex('link','link');t.createIndex('pay','pay');}
    STORES.slice(1).forEach(n=>{if(!d.objectStoreNames.contains(n))d.createObjectStore(n,{keyPath:'id'})});};
  r.onsuccess=()=>res(r.result);r.onerror=()=>res(null);r.onblocked=()=>res(null);
  setTimeout(()=>res(null),4000);
}catch(e){res(null)}})}
const os=(s,mode)=>idb.transaction(s,mode).objectStore(s);
async function dbAll(s){if(!idb)return[...mem[s].values()];return rq(os(s).getAll())}
async function dbPut(s,o){if(!idb){mem[s].set(o.id,o);return}await rq(os(s,'readwrite').put(o))}
async function dbDel(s,id){if(!idb){mem[s].delete(id);return}await rq(os(s,'readwrite').delete(id))}
async function dbClear(s){if(!idb){mem[s].clear();return}await rq(os(s,'readwrite').clear())}
async function dbBulk(s,arr){if(!idb){arr.forEach(o=>mem[s].set(o.id,o));return}
  await new Promise((res,rej)=>{const t=idb.transaction(s,'readwrite');const st=t.objectStore(s);arr.forEach(o=>st.put(o));t.oncomplete=res;t.onerror=()=>rej(t.error)})}
async function txRange(lo,hi){if(!idb)return[...mem.tx.values()].filter(t=>t.date>=lo&&t.date<=hi);return rq(os('tx').index('date').getAll(IDBKeyRange.bound(lo,hi)))}
async function txBy(ix,key){if(!idb)return[...mem.tx.values()].filter(t=>t[ix]===key);return rq(os('tx').index(ix).getAll(key))}
async function txCount(){if(!idb)return mem.tx.size;return rq(os('tx').count())}
async function txSearch(q,limit=200){const out=[];q=q.toLowerCase();
  const hit=t=>((t.note||'')+' '+(CAT[t.cat]?.l||'')+' '+t.amount).toLowerCase().includes(q);
  if(!idb){return[...mem.tx.values()].filter(hit).sort((a,b)=>b.date.localeCompare(a.date)).slice(0,limit)}
  return new Promise(res=>{const c=os('tx').index('date').openCursor(null,'prev');c.onsuccess=()=>{const cur=c.result;if(!cur||out.length>=limit)return res(out);if(hit(cur.value))out.push(cur.value);cur.continue()};c.onerror=()=>res(out)})}

/* ========== categories & plans ========== */
const GROUPS={need:{l:'จำเป็น',c:'var(--sky)',s:'var(--sky-soft)'},debt:{l:'ผ่อนหนี้',c:'var(--peach)',s:'var(--peach-soft)'},save:{l:'ออม/ลงทุน',c:'var(--sprout)',s:'var(--sprout-soft)'},grow:{l:'พัฒนาตัวเอง',c:'var(--lilac)',s:'var(--lilac-soft)'},joy:{l:'ความสุข',c:'var(--sun)',s:'var(--sun-soft)'}};
const GK=Object.keys(GROUPS);
const CATDEF={
  out:[['food','อาหาร','need'],['travel','เดินทาง','need'],['rent','ค่าห้อง/ผ่อนบ้าน','need'],['util','น้ำ-ไฟ','need'],['phone','โทรศัพท์/เน็ต','need'],['family','ส่งให้ครอบครัว','need'],['house','ของใช้ในบ้าน','need'],['health','สุขภาพ/ยา','need'],['biz','ต้นทุนร้าน/งาน','need'],['ins','เบี้ยประกัน','need','ins'],['loan','ผ่อนหนี้/สินเชื่อ','debt','debt'],['fee','ดอกเบี้ย/ค่าปรับ','debt'],['tax','ภาษีหัก ณ ที่จ่าย',null],['sso','ประกันสังคม',null],['pvd','กองทุนสำรองเลี้ยงชีพ','save','inv'],['save','เงินออม/สำรองฉุกเฉิน','save','goal'],['invest','ลงทุน','save','inv'],['learn','คอร์ส/หนังสือ','grow'],['shop','ช้อปปิ้ง','joy'],['cafe','คาเฟ่/กินนอกบ้าน','joy'],['fun','บันเทิง/สมาชิกรายเดือน','joy'],['social','งานสังคม/ของขวัญ','joy'],['other','อื่นๆ','joy']],
  in:[['salary','เงินเดือน'],['shift','ค่าเวร/OT',null,null,0,1],['bonus','โบนัส/คอมมิชชั่น',null,null,0,1],['side','รายได้เสริม/ขายของ',null,null,0,1],['affiliate','Affiliate/ค่าคอมออนไลน์',null,null,0,1],['shop','รายได้จากร้าน (กำไร)',null,null,0,1],['otherin','รายรับอื่นๆ'],['withdraw','ถอนเงินออม/ขายลงทุน',null,'gi',1]],
  pay:[['cardpay','ชำระบัตรเครดิต',null,'card']]
};
const CAT={};Object.entries(CATDEF).forEach(([type,arr])=>arr.forEach(([k,l,g,link,noInc,vari])=>CAT[k]={k,l,g:g||null,link:link||null,noInc:!!noInc,vari:!!vari,type}));
const catColor=k=>{const c=CAT[k];if(!c)return['var(--surface2)','var(--muted)'];if(c.type==='in')return['var(--sprout-soft)','var(--sprout)'];if(c.type==='pay')return['var(--peach-soft)','var(--peach)'];const g=GROUPS[c.g];if(!g)return['var(--surface2)','var(--muted)'];return[g.s,g.c]};
const PLANS={
  balance:{l:'สมดุลมือใหม่',d:'หนี้น้อย อยากเริ่มจัดระเบียบ',p:{need:50,debt:15,save:15,grow:5,joy:15}},
  debtor:{l:'ฉบับคนมีหนี้',d:'ผ่อนหลายก้อน แต่ยังอยากออมและโต',p:{need:50,debt:22,save:13,grow:10,joy:5}},
  sprint:{l:'หนี้หนัก เร่งปลด',d:'ภาระผ่อนเกิน 40% ของรายได้',p:{need:45,debt:40,save:10,grow:0,joy:5}},
  growth:{l:'ปลอดหนี้ เน้นโต',d:'ไม่มีหนี้ดอกสูงแล้ว',p:{need:50,debt:0,save:30,grow:10,joy:10}},
  custom:{l:'กำหนดเอง',d:'ปรับสัดส่วนเอง',p:null}
};
const DEBT_KINDS=['สินเชื่อบุคคล','ผ่อนสินค้า 0%','Pay Later / ผ่อนในแอป','สินเชื่อรถ','สินเชื่อบ้าน','กยศ.','ยืมคนรู้จัก','หนี้นอกระบบ','อื่นๆ'];
const INV_KINDS=['กองทุนรวม','หุ้น','ทองคำ','เงินฝาก/ออมทรัพย์','SSF / RMF / ThaiESG','กองทุนสำรองเลี้ยงชีพ','พันธบัตร/สลาก','คริปโต','อื่นๆ'];
const INS_KINDS=['สุขภาพ','ชีวิต','อุบัติเหตุ','โรคร้ายแรง','ออมทรัพย์/บำนาญ','รถยนต์','บ้าน/ทรัพย์สิน','อื่นๆ'];
const FREQ={1:'รายเดือน',3:'ราย 3 เดือน',6:'ราย 6 เดือน',12:'รายปี'};

/* ========== mascot (original character: "ถั่วงอก" a round sprout bean) ========== */
const MASCOT_COLORS=['#A8DDBE','#FFC2CF','#FFD98A','#B9CCFF','#D6C4FF','#F4E6D2'];
const MASCOT_ACC={none:'ไม่มี',nurse:'หมวกพยาบาล',glasses:'แว่นกลม',bow:'โบว์',cap:'หมวกรับปริญญา',band:'ผ้าคาดผม',scarf:'ผ้าพันคอ'};
const MOODS={happy:'ยิ้ม',party:'ฉลอง',worried:'กังวล',calm:'ชิล'};
function shade(hex,amt){const n=parseInt(hex.slice(1),16);let r=(n>>16)+amt,g=(n>>8&255)+amt,b=(n&255)+amt;return'#'+[r,g,b].map(v=>clamp(v,0,255).toString(16).padStart(2,'0')).join('')}
let _gid=0;
function mascotSVG({mood='happy',color='#A8DDBE',acc='none',stage=1,bob=false}={}){
  const ol='#3A3150',ck='#FF8FA8',dk=shade(color,-40),G='m'+(++_gid);
  const defs=`<defs><radialGradient id="${G}b" cx="36%" cy="30%" r="78%"><stop offset="0" stop-color="${shade(color,48)}"/><stop offset=".5" stop-color="${color}"/><stop offset="1" stop-color="${shade(color,-60)}"/></radialGradient>
  <radialGradient id="${G}f" cx="40%" cy="30%" r="80%"><stop offset="0" stop-color="${shade(color,10)}"/><stop offset="1" stop-color="${shade(color,-75)}"/></radialGradient>
  <radialGradient id="${G}l" cx="35%" cy="30%" r="80%"><stop offset="0" stop-color="#B8F0C8"/><stop offset=".6" stop-color="#5DBB7E"/><stop offset="1" stop-color="#2F7D4C"/></radialGradient>
  <radialGradient id="${G}s"><stop offset="0" stop-color="#1A1030" stop-opacity=".35"/><stop offset="1" stop-color="#1A1030" stop-opacity="0"/></radialGradient>
  <radialGradient id="${G}c"><stop offset="0" stop-color="${ck}" stop-opacity=".9"/><stop offset="1" stop-color="${ck}" stop-opacity="0"/></radialGradient></defs>`;
  const leaf=(cx,cy,rx,ry,rot)=>`<ellipse cx="${cx}" cy="${cy}" rx="${rx}" ry="${ry}" fill="url(#${G}l)" stroke="#2F7D4C" stroke-width="1.5" transform="rotate(${rot} ${cx} ${cy})"/><ellipse cx="${cx-3}" cy="${cy-3}" rx="${rx*.45}" ry="${ry*.3}" fill="#fff" opacity=".45" transform="rotate(${rot} ${cx} ${cy})"/>`;
  let sprout=`<path d="M100 66 C100 52 101 42 100 30" stroke="#3E9B5F" stroke-width="5" fill="none" stroke-linecap="round"/>`;
  sprout+=leaf(86,32,15,8,-25);
  if(stage>=1)sprout+=leaf(114,26,15,8,25);
  if(stage>=2)sprout+=leaf(88,50,11,6,-35);
  if(stage>=3)sprout+=`<g transform="translate(100 22)">${[0,72,144,216,288].map(a=>`<ellipse cx="0" cy="-9" rx="6" ry="8" fill="#FFB3C4" stroke="#E0708C" stroke-width="1.5" transform="rotate(${a})"/>`).join('')}<circle r="6" fill="#FFD45E" stroke="#D99A1E" stroke-width="1.5"/></g>`;
  let eyes,mouth,extra='';
  if(mood==='party'){eyes=`<path d="M72 116 q8 -10 16 0 M112 116 q8 -10 16 0" stroke="${ol}" stroke-width="4.5" fill="none" stroke-linecap="round"/>`;mouth=`<path d="M88 130 q12 18 24 0 z" fill="#E2546C" stroke="${ol}" stroke-width="3.5" stroke-linejoin="round"/>`;
    extra=`<g stroke-width="0"><rect x="30" y="64" width="8" height="8" rx="2" fill="#FFD45E" transform="rotate(20 34 68)"/><rect x="160" y="70" width="8" height="8" rx="2" fill="#FF8FA8" transform="rotate(-15 164 74)"/><circle cx="42" cy="96" r="4" fill="#8FB4FF"/><circle cx="162" cy="100" r="4" fill="#6CC28A"/></g>`}
  else if(mood==='worried'){eyes=`<circle cx="80" cy="117" r="6.5" fill="${ol}"/><circle cx="120" cy="117" r="6.5" fill="${ol}"/><path d="M70 104 l16 4 M130 104 l-16 4" stroke="${ol}" stroke-width="4" stroke-linecap="round"/>`;mouth=`<path d="M88 138 q6 -6 12 0 t12 0" stroke="${ol}" stroke-width="4" fill="none" stroke-linecap="round"/>`;
    extra=`<path d="M150 86 q8 12 0 18 q-8 -6 0 -18z" fill="#9CC9FF" stroke="${ol}" stroke-width="2.5"/>`}
  else if(mood==='calm'){eyes=`<path d="M72 118 h15 M113 118 h15" stroke="${ol}" stroke-width="4.5" stroke-linecap="round"/>`;mouth=`<path d="M93 132 q7 6 14 0" stroke="${ol}" stroke-width="4" fill="none" stroke-linecap="round"/>`}
  else{eyes=`<ellipse cx="80" cy="116" rx="8" ry="9" fill="${ol}"/><ellipse cx="120" cy="116" rx="8" ry="9" fill="${ol}"/><circle cx="83" cy="112" r="3.4" fill="#fff"/><circle cx="123" cy="112" r="3.4" fill="#fff"/><circle cx="77.5" cy="120" r="1.5" fill="#fff" opacity=".8"/><circle cx="117.5" cy="120" r="1.5" fill="#fff" opacity=".8"/>`;mouth=`<path d="M90 131 q5 7 10 0 q5 7 10 0" stroke="${ol}" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round"/>`}
  let a='';
  if(acc==='nurse')a=`<g transform="translate(100 70)"><path d="M-34 6 L-26 -18 Q0 -28 26 -18 L34 6 Q0 -2 -34 6Z" fill="#fff" stroke="#CFC8DD" stroke-width="2.5" stroke-linejoin="round"/><path d="M-26 -2 Q0 -8 26 -2" stroke="#E6E1EF" stroke-width="2" fill="none"/><path d="M-4 -16h8v5h5v8h-5v5h-8v-5h-5v-8h5z" fill="#FF6B7A"/></g>`;
  if(acc==='glasses')a=`<g fill="none" stroke="${ol}" stroke-width="3.5"><circle cx="80" cy="116" r="15"/><circle cx="120" cy="116" r="15"/><path d="M95 114 q5 -4 10 0"/></g>`;
  if(acc==='bow')a=`<g transform="translate(140 74) rotate(20)"><path d="M0 0 L-20 -12 L-20 12 Z M0 0 L20 -12 L20 12 Z" fill="#FF8FA8" stroke="${ol}" stroke-width="3" stroke-linejoin="round"/><circle r="6" fill="#FF6F8E" stroke="${ol}" stroke-width="3"/></g>`;
  if(acc==='cap')a=`<g transform="translate(100 70) rotate(-8)"><path d="M-44 -6 L0 -24 L44 -6 L0 12 Z" fill="#3A3150" stroke="${ol}" stroke-width="3" stroke-linejoin="round"/><path d="M-24 2 v14 q24 12 48 0 v-14" fill="#3A3150"/><path d="M30 -2 v22" stroke="#FFD45E" stroke-width="3"/><circle cx="30" cy="22" r="4" fill="#FFD45E"/></g>`;
  if(acc==='band')a=`<path d="M38 96 Q100 66 162 96" stroke="#FF8FA8" stroke-width="10" fill="none" stroke-linecap="round"/><circle cx="56" cy="86" r="4" fill="#fff"/><circle cx="144" cy="86" r="4" fill="#fff"/>`;
  if(acc==='scarf')a=`<path d="M48 150 Q100 176 152 150 L150 164 Q100 188 50 164 Z" fill="#8FB4FF" stroke="${ol}" stroke-width="3" stroke-linejoin="round"/><path d="M128 166 l8 22 l12 -6 l-6 -20" fill="#8FB4FF" stroke="${ol}" stroke-width="3" stroke-linejoin="round"/>`;
  const capFirst=acc==='cap'||acc==='nurse';
  return `<svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="น้องถั่วงอก">${defs}<ellipse cx="100" cy="190" rx="66" ry="9" fill="url(#${G}s)"/><g class="${bob?'mascot-bob':''}">${capFirst?'':sprout}
  <ellipse cx="74" cy="182" rx="17" ry="9" fill="url(#${G}f)"/><ellipse cx="126" cy="182" rx="17" ry="9" fill="url(#${G}f)"/>
  <path d="M100 64 C150 64 172 98 170 132 C168 168 138 184 100 184 C62 184 32 168 30 132 C28 98 50 64 100 64Z" fill="url(#${G}b)" stroke="${shade(color,-70)}" stroke-width="2"/>
  <ellipse cx="70" cy="92" rx="20" ry="11" fill="#fff" opacity=".55" transform="rotate(-32 70 92)"/><circle cx="92" cy="80" r="4" fill="#fff" opacity=".7"/>
  <path d="M46 150 Q100 192 154 150" stroke="${shade(color,-80)}" stroke-opacity=".18" stroke-width="10" fill="none" stroke-linecap="round"/>
  <ellipse cx="62" cy="136" rx="15" ry="10" fill="url(#${G}c)"/><ellipse cx="138" cy="136" rx="15" ry="10" fill="url(#${G}c)"/>

/* ========== loading ========== */
async function loadEntities(){
  for(const s of ['debts','cards','invs','ins','goals','recur'])S[s]=(await dbAll(s)).sort((a,b)=>(a.order||0)-(b.order||0)||String(a.created||'').localeCompare(String(b.created||'')));
  const m=(await dbAll('meta')).find(x=>x.id==='settings');S.meta=Object.assign(defaultMeta(),m||{});
  S.ent={};
  const keys=[...S.debts.map(d=>'debt:'+d.id),...S.cards.map(c=>'card:'+c.id),...S.invs.map(v=>'inv:'+v.id),...S.ins.map(p=>'ins:'+p.id),...S.goals.map(g=>'goal:'+g.id)];
  await Promise.all(keys.map(async k=>{S.ent['L:'+k]=await txBy('link',k);if(k.startsWith('card:'))S.ent['P:'+k]=await txBy('pay',k)}));
}
async function loadMonth(){const[a,b]=monthBounds(S.y,S.m);S.monthTx=(await txRange(a,b)).sort((x,y)=>y.date.localeCompare(x.date)||(y.ts||0)-(x.ts||0));const p=new Date(S.y,S.m-1,1);const[c,d]=monthBounds(p.getFullYear(),p.getMonth());S.prevTx=await txRange(c,d)}
async function refreshKeys(keys){for(const k of keys){if(!k)continue;S.ent['L:'+k]=await txBy('link',k);if(k.startsWith('card:'))S.ent['P:'+k]=await txBy('pay',k)}}
async function saveMeta(){await dbPut('meta',S.meta)}

/* ========== derived balances (always computed from records, so edits/deletes stay consistent) ========== */
const counts=(t,e)=>!e.asOf||t.date>e.asOf||(t.date===e.asOf&&(t.ts||0)>(e.balTs||0));
const linked=(k,e)=>(S.ent['L:'+k]||[]).filter(t=>counts(t,e));
const dRate=d=>d.flat?0:num(d.rate);
const dInt=(d,bal)=>(bal??debtBal(d))*dRate(d)/1200;
function debtBal(d){return Math.max(0,num(d.balance)-sum(linked('debt:'+d.id,d),t=>t.amount-(t.interest||0)))}
function cardBal(c){const buys=(S.ent['P:card:'+c.id]||[]).filter(t=>t.type==='out'&&counts(t,c));const pays=linked('card:'+c.id,c).filter(t=>t.type==='pay');return Math.max(0,num(c.balance)+sum(buys)-sum(pays))}
function cardMin(c,b){b=b??cardBal(c);if(b<=0)return 0;return Math.min(b,Math.max(num(c.minFloor),Math.ceil(b*(num(c.minPct)||8)/100)))}
function invVal(v){const l=linked('inv:'+v.id,v);return Math.max(0,num(v.value)+sum(l.filter(t=>t.type==='out'))-sum(l.filter(t=>t.type==='in')))}
function invCost(v){const l=linked('inv:'+v.id,v);return Math.max(0,num(v.cost)+sum(l.filter(t=>t.type==='out'))-sum(l.filter(t=>t.type==='in')))}
function goalVal(g){const l=linked('goal:'+g.id,g);return Math.max(0,num(g.saved)+sum(l.filter(t=>t.type==='out'))-sum(l.filter(t=>t.type==='in')))}
function insPaid(p){return(S.ent['L:ins:'+p.id]||[]).length}
function insNext(p){return addMonths(p.firstDue||todayStr(),(num(p.freq)||12)*insPaid(p))}
const insYear=p=>num(p.premium)*(12/(num(p.freq)||12));
function totals(){
  const debts=S.debts.map(d=>({d,bal:debtBal(d)}));const cards=S.cards.map(c=>{const b=cardBal(c);return{c,bal:b,min:cardMin(c,b)}});
  const debtTotal=sum(debts,x=>x.bal)+sum(cards,x=>x.bal);
  const minTotal=sum(debts.filter(x=>x.bal>0),x=>Math.min(num(x.d.minPay),x.bal))+sum(cards,x=>x.min);
  const goals=sum(S.goals,g=>goalVal(g)),inv=sum(S.invs,v=>invVal(v));
  const ef=sum(S.goals.filter(g=>g.kind==='emergency'),g=>goalVal(g));
  return{debts,cards,debtTotal,minTotal,goals,inv,ef,net:goals+inv-debtTotal};
}

/* ========== month aggregation ========== */
function agg(txs){
  const a={inc:0,cashIn:0,out:0,cashOut:0,cardBuy:0,cardPay:0,byCat:{},grp:{need:0,debt:0,save:0,grow:0,joy:0}};
  for(const t of txs){const c=CAT[t.cat];const v=num(t.amount);
    if(t.type==='in'){a.cashIn+=v;if(!c?.noInc)a.inc+=v}
    else if(t.type==='out'){a.out+=v;a.byCat[t.cat]=(a.byCat[t.cat]||0)+v;if(c?.g)a.grp[c.g]+=v;if(t.pay)a.cardBuy+=v;else a.cashOut+=v}
    else if(t.type==='pay'){a.cardPay+=v}}
  a.netCardPaydown=Math.max(0,a.cardPay-a.cardBuy);a.grp.debt+=a.netCardPaydown;
  a.cash=a.cashIn-a.cashOut-a.cardPay;return a;
}
const incomeBase=a=>num(S.meta.income)||a.inc;
const planAmt=(g,a)=>incomeBase(a)*(num(S.meta.plan?.[g]))/100;

/* ========== debt payoff simulation ========== */
function debtItems(){const T=totals();
  return[...T.debts.filter(x=>x.bal>0).map(x=>({id:'d'+x.d.id,name:x.d.name,bal:x.bal,rate:dRate(x.d),min:Math.max(1,num(x.d.minPay))})),
         ...T.cards.filter(x=>x.bal>0).map(x=>({id:'c'+x.c.id,name:x.c.name,bal:x.bal,rate:num(x.c.rate),min:Math.max(1,x.min)}))]}
function simulate(items,extra,strat,rollover=true){
  const ds=items.map(d=>({...d}));let month=0,totalInt=0;const series=[sum(ds,d=>d.bal)],done={},log=[];
  while(ds.some(d=>d.bal>0.5)&&month<600){month++;const pays={};
    ds.forEach(d=>{if(d.bal>0){const i=d.bal*d.rate/1200;d.bal+=i;totalInt+=i}});
    let pool=extra;
    ds.forEach(d=>{if(d.bal>0){const p=Math.min(d.min,d.bal);d.bal-=p;pays[d.id]=p;if(rollover)pool+=d.min-p}else if(rollover)pool+=d.min});
    const order=ds.filter(d=>d.bal>0.5).sort(strat==='snowball'?(a,b)=>a.bal-b.bal:(a,b)=>b.rate-a.rate||a.bal-b.bal);
    let focus=order[0]?.id||null;
    for(const d of order){if(pool<=0)break;const p=Math.min(pool,d.bal);d.bal-=p;pool-=p;pays[d.id]=(pays[d.id]||0)+p}
    ds.forEach(d=>{if(d.bal<=0.5&&!done[d.id]){done[d.id]=month;d.bal=0}});
    if(month<=12)log.push({month,pays,focus});
    series.push(sum(ds,d=>d.bal));}
  return{months:month,totalInt,done,series,log,stuck:ds.some(d=>d.bal>0.5)};
}

  if(inc>0&&T.minTotal>0){const r=T.minTotal/inc;const p=Math.round(r*100);
    if(r>=.5)L.push({lv:'bad',t:`ค่างวดขั้นต่ำรวม ${p}% ของรายได้`,b:'เกินครึ่งของรายได้ ถ้าเริ่มจ่ายไม่ไหว ให้โทรคุยเจ้าหนี้ก่อนถึงวันครบกำหนดเพื่อขอยืดงวดหรือปรับโครงสร้างหนี้ อย่ากู้ก้อนใหม่มาจ่ายก้อนเก่า ปรึกษาฟรีได้ที่ศูนย์คุ้มครองผู้ใช้บริการทางการเงิน ธปท. โทร 1213'});
    else if(r>=.4)L.push({lv:'warn',t:`ค่างวดขั้นต่ำรวม ${p}% ของรายได้`,b:'เกิน 40% ถือว่าตึง ช่วงนี้หยุดก่อหนี้ใหม่ทุกแบบ รวมถึงผ่อน 0% และ Pay Later จนกว่าจะลดลงต่ำกว่า 40%'});
    else L.push({lv:'good',t:`ค่างวดขั้นต่ำรวม ${p}% ของรายได้`,b:'ยังอยู่ในระดับรับไหว ใช้เงินส่วนเกินโปะก้อนตามแผนปลดหนี้'});}
  T.debts.forEach(({d,bal})=>{const i=dInt(d,bal);if(bal>0&&i>0&&num(d.minPay)<=i)L.push({lv:'bad',t:`${d.name}: ค่างวดไม่พอจ่ายดอกเบี้ย`,b:`ดอกเบี้ยเดือนละประมาณ ${baht(i)} แต่จ่าย ${baht(d.minPay)} ยอดจะไม่ลดเลย ต้องเพิ่มค่างวดหรือเจรจาลดดอกเบี้ย`})});
  T.cards.forEach(({c,bal,min})=>{if(!bal)return;const lim=num(c.limit);const u=lim?bal/lim:0;const i=bal*num(c.rate)/1200;
    if(u>=.7)L.push({lv:'bad',t:`${c.name}: ใช้วงเงิน ${Math.round(u*100)}%`,b:`ถ้าจ่ายแค่ขั้นต่ำ ${baht(min)} จะเสียดอกเบี้ยราว ${baht(i)}/เดือน ช่วงปลดหนี้ให้พักบัตรใบนี้ไว้ ใช้เงินสดหรือเดบิตแทน และจ่ายให้มากกว่าขั้นต่ำ`});
    else if(u>=.3)L.push({lv:'warn',t:`${c.name}: ใช้วงเงิน ${Math.round(u*100)}%`,b:`ดอกเบี้ยราว ${baht(i)}/เดือนถ้าไม่จ่ายเต็ม พยายามให้ยอดค้างต่ำกว่า 30% ของวงเงิน`});});
  const ess=planAmt('need',a)||a.grp.need;
  if(ess>0){const mo=T.ef/ess;
    if(mo<1)L.push({lv:'warn',t:`เงินสำรองฉุกเฉิน ${mo.toFixed(1)} เดือน`,b:`ตอนมีหนี้ เก็บให้ถึง 1 เดือนก่อน (ราว ${baht(ess)}) แล้วค่อยเร่งโปะ ถ้าไม่มีสำรอง เรื่องฉุกเฉินจะกลายเป็นหนี้บัตรรอบใหม่`,act:S.goals.some(g=>g.kind==='emergency')?null:'addGoalEF'});
    else if(mo<3&&T.debtTotal===0)L.push({lv:'warn',t:`เงินสำรอง ${mo.toFixed(1)} เดือน`,b:'ปลอดหนี้แล้ว ขยับเป้าเป็น 3–6 เดือนของค่าใช้จ่ายจำเป็น'});
    else if(mo>=1)L.push({lv:'good',t:`เงินสำรองฉุกเฉิน ${mo.toFixed(1)} เดือน`,b:T.debtTotal>0?'ถึงขั้นต่ำแล้ว เงินส่วนเกินให้ไปโปะหนี้ดอกสูงก่อน':'ดีมาก รักษาไว้ระดับนี้'})}
  const hiRate=Math.max(0,...T.debts.filter(x=>x.bal>0&&!x.d.flat).map(x=>num(x.d.rate)),...T.cards.filter(x=>x.bal>0).map(x=>num(x.c.rate)));
  if((a.byCat.invest||0)>0&&hiRate>=12)L.push({lv:'warn',t:`ลงทุนเดือนนี้ ขณะมีหนี้ดอก ${hiRate}%`,b:'ผลตอบแทนลงทุนทั่วไปมักต่ำกว่าดอกเบี้ยบัตร/สินเชื่อ การโปะหนี้ดอกสูงคือผลตอบแทนที่แน่นอน ยกเว้นกองทุนสำรองเลี้ยงชีพที่นายจ้างสมทบ หรือเงินที่ใช้สิทธิลดหย่อนภาษี'});
  if(inc>0)GK.forEach(g=>{const p=planAmt(g,a),v=a.grp[g];if(p>0&&v>p*1.02&&g!=='debt'&&g!=='save')L.push({lv:'warn',t:`${GROUPS[g].l} เกินงบ ${baht(v-p)}`,b:g==='joy'?'ลองกำหนดงบรายสัปดาห์ แล้วเงินที่เหลือวันอาทิตย์เอาไปโปะหนี้':'ดูรายการในหมวดนี้ว่ามีอะไรที่ลดหรือเลื่อนได้'})});
  S.ins.forEach(p=>{const n=insNext(p);const dd=daysBetween(todayStr(),n);if(dd<=30)L.push({lv:dd<0?'bad':'warn',t:`เบี้ย${p.name} ${dd<0?'เลยกำหนด '+(-dd)+' วัน':'ครบใน '+dd+' วัน'}`,b:`${baht(p.premium)} · ${fmtDate(n)} ขาดส่งเบี้ยอาจทำให้กรมธรรม์ขาดอายุ เตรียมเงินไว้ก่อน`})});
  if(cur&&inc>0&&!L.some(x=>x.lv!=='good'))L.push({lv:'good',t:'เดือนนี้ไปได้ดี',b:'ทุกวันอาทิตย์ รวมเงินที่เหลือจากงบรายสัปดาห์ไปโปะหนี้ก้อนเป้าหมาย'});
  const ord={bad:0,warn:1,good:2};return L.sort((x,y)=>ord[x.lv]-ord[y.lv]);
}
function mood(a,T){if(a.cash<0||T.minTotal>incomeBase(a)*.5&&incomeBase(a)>0)return'worried';if(T.debtTotal===0&&T.ef>0)return'party';return'happy'}
function stage(T){const peak=Math.max(num(S.meta.peakDebt),T.debtTotal);if(peak<=0)return 3;const p=1-T.debtTotal/peak;return p>=1?3:p>=.5?2:p>=.15?1:0}

function upcoming(){
  const out=[];const t0=todayStr();const[ms,me]=monthBounds(now.getFullYear(),now.getMonth());
  const paidThisMonth=k=>(S.ent['L:'+k]||[]).some(t=>t.date>=ms&&t.date<=me);
  const mk=day=>{const d=new Date(now.getFullYear(),now.getMonth(),Math.min(num(day),new Date(now.getFullYear(),now.getMonth()+1,0).getDate()));return ymd(d)};
  S.debts.forEach(d=>{if(!num(d.dueDay)||debtBal(d)<=0)return;const date=mk(d.dueDay);const paid=paidThisMonth('debt:'+d.id);const days=daysBetween(t0,date);if(paid||days<=14)out.push({name:d.name,date,days,paid,amt:Math.min(num(d.minPay),debtBal(d)),act:'payDebt',id:d.id})});
  S.cards.forEach(c=>{const b=cardBal(c);if(!num(c.dueDay)||b<=0)return;const date=mk(c.dueDay);const paid=paidThisMonth('card:'+c.id);const days=daysBetween(t0,date);if(paid||days<=14)out.push({name:c.name+' (ขั้นต่ำ)',date,days,paid,amt:cardMin(c,b),act:'payCard',id:c.id})});
  S.ins.forEach(p=>{const date=insNext(p);const days=daysBetween(t0,date);if(days<=14)out.push({name:'เบี้ย'+p.name,date,days,paid:false,amt:num(p.premium),act:'payIns',id:p.id})});
  return out.sort((a,b)=>(a.paid-b.paid)||a.days-b.days);
}
function pendingRecur(){const done=new Set(S.monthTx.filter(t=>t.recurId).map(t=>t.recurId));return S.recur.filter(r=>!done.has(r.id))}

function donut(parts){parts=parts.filter(p=>p[1]>0);const tot=sum(parts,p=>p[1]);if(!tot)return'';let a0=-Math.PI/2;const R=52,r=32,cx=70,cy=70;

    const[x0,y0]=p(R,a0),[x1,y1]=p(R,a1-1e-4),[x2,y2]=p(r,a1-1e-4),[x3,y3]=p(r,a0);const d=`M${x0} ${y0}A${R} ${R} 0 ${big} 1 ${x1} ${y1}L${x2} ${y2}A${r} ${r} 0 ${big} 0 ${x3} ${y3}Z`;a0=a1;return`<path d="${d}" fill="${c}"/>`}).join('');
  return`<div class="row" style="flex-wrap:wrap;gap:16px"><svg viewBox="0 0 140 140" width="130" height="130" aria-hidden="true">${arcs}</svg><div class="legend" style="flex-direction:column;flex:1;min-width:140px">${parts.map(([l,v,c])=>`<span><i class="dot" style="background:${c}"></i>${l} <b class="num" style="color:var(--ink)">${Math.round(v/tot*100)}%</b></span>`).join('')}</div></div>`}

  for(let i=0;i<12;i++){const d=new Date(S.y,S.m-11+i,1);const[a,b]=monthBounds(d.getFullYear(),d.getMonth());const g=agg(txs.filter(t=>t.date>=a&&t.date<=b));months.push({mo:d.getMonth(),l:TH_M[d.getMonth()],y:d.getFullYear(),inc:g.inc,out:g.out,debt:g.grp.debt,save:g.grp.save})}
  const max=Math.max(1,...months.map(m=>Math.max(m.inc,m.out)));const W=360,H=170,bw=10;

  const T=totals();
  let h=`<div class="sec"><div class="card"><div class="small muted">ความมั่งคั่งสุทธิ (เงินออม + ลงทุน − หนี้)</div><div style="font-family:var(--f-display);font-size:28px;font-weight:700;color:${T.net<0?'var(--bad)':'var(--sprout)'}" class="num">${T.net<0?'−':''}${baht(Math.abs(T.net))}</div><div class="meta"><span>ออม <b>${baht(T.goals)}</b></span><span>ลงทุน <b>${baht(T.inv)}</b></span><span>หนี้ <b>${baht(T.debtTotal)}</b></span></div>${T.net<0?'<p class="hint" style="margin:6px 0 0">ติดลบเป็นเรื่องปกติของช่วงปลดหนี้ เป้าคือให้ตัวเลขนี้ขยับขึ้นทุกเดือน</p>':''}</div></div>`;
  h+=`<div class="sec">${seg('grow',[['goals','เป้าหมายออม'],['inv','ลงทุน'],['ins','ประกัน']])}</div>`;
  const sub=S.sub.grow;
  if(sub==='goals'){
    if(!S.goals.length)return h+`<div class="sec">${empty('เริ่มจากกระปุกเงินสำรองฉุกเฉินก่อน แล้วค่อยเพิ่มเป้าอื่น เช่น ค่าเทอม ทริป หรือเงินดาวน์','สร้างเงินสำรองฉุกเฉิน','addGoalEF')}</div>`;
    h+=`<div class="sec">${S.goals.map(g=>{const v=goalVal(g),tg=num(g.target);let pace='';if(g.deadline&&tg>v){const mo=Math.max(1,Math.ceil(daysBetween(todayStr(),g.deadline)/30.4));pace=`ต้องเก็บ <b>${baht((tg-v)/mo)}</b>/เดือน อีก ${mo} เดือน`}
      return`<div class="card ent"><div class="head"><div style="flex:1;min-width:0"><b>${esc(g.name)}</b><div class="small muted">${g.kind==='emergency'?'เงินสำรองฉุกเฉิน · เก็บในบัญชีที่ถอนได้ทันที':'เป้าหมาย'}${g.deadline?' · ภายใน '+fmtDate(g.deadline):''}</div></div>${tg&&v>=tg?'<span class="chip good">ครบแล้ว</span>':''}</div><div class="row between" style="align-items:flex-end"><span class="big num">${baht(v)}</span><span class="small muted num">จาก ${baht(tg)}</span></div>${bar(v,tg,'var(--sprout)')}${pace?`<div class="meta"><span>${pace}</span></div>`:''}<div class="row" style="gap:8px"><button class="btn sm green" data-act="depGoal" data-id="${g.id}">หยอดเงิน</button><button class="btn sm soft" data-act="editGoal" data-id="${g.id}">แก้ไข</button></div></div>`}).join('')}<button class="btn soft" data-act="addGoal">+ เพิ่มเป้าหมาย</button></div>`;
    return h;
  }
  if(sub==='inv'){
    let pre='';const hi=totals();const hiRate=Math.max(0,...hi.cards.filter(x=>x.bal>0).map(x=>num(x.c.rate)),...hi.debts.filter(x=>x.bal>0).map(x=>num(x.d.rate)));
    if(hiRate>=12)pre=`<div class="ins warn"><div><b>ยังมีหนี้ดอก ${hiRate}%</b><p>ลำดับที่ใช้ได้จริง: 1) เงินสำรอง 1 เดือน 2) ปิดหนี้ดอกเกิน ~10% 3) ค่อยเพิ่มเงินลงทุน ยกเว้นกองทุนสำรองเลี้ยงชีพที่บริษัทสมทบ ให้ทำต่อ</p></div></div>`;
    if(!S.invs.length)return h+`<div class="sec">${pre}${empty('บันทึกพอร์ตลงทุน เช่น กองทุนรวม หุ้น ทอง กองทุนสำรองเลี้ยงชีพ แล้วอัปเดตมูลค่าเดือนละครั้ง','เพิ่มการลงทุน','addInv')}</div>`;
    const tot=sum(S.invs,v=>invVal(v)),cost=sum(S.invs,v=>invCost(v));const byK={};S.invs.forEach(v=>byK[v.kind]=(byK[v.kind]||0)+invVal(v));
    const pal=['var(--sprout)','var(--sky)','var(--sun)','var(--lilac)','var(--peach)','var(--muted)','var(--good)','var(--warn)','var(--bad)'];
    h+=`<div class="sec">${pre}<div class="card stack"><div class="row between"><span><span class="small muted">มูลค่ารวม</span><br><b class="num" style="font-size:20px">${baht(tot)}</b></span><span style="text-align:right"><span class="small muted">กำไร/ขาดทุน</span><br><b class="num" style="color:${tot>=cost?'var(--good)':'var(--bad)'}">${tot>=cost?'+':'−'}${baht(Math.abs(tot-cost))} (${cost?((tot-cost)/cost*100).toFixed(1):0}%)</b></span></div>${donut(Object.entries(byK).map(([k,v],i)=>[k,v,pal[i%pal.length]]))}</div>`;
    h+=`<div class="list">${S.invs.map(v=>{const val=invVal(v),c=invCost(v);return`<button class="li" data-act="editInv" data-id="${v.id}"><span class="ic" style="background:var(--sprout-soft);color:var(--sprout)">${esc(v.kind.replace(/^[เแโใไ]/,'').slice(0,1))}</span><span class="t"><b>${esc(v.name)}</b><span>${esc(v.kind)} · อัปเดต ${v.asOf?fmtDate(v.asOf):'–'}</span></span><span style="text-align:right"><span class="amt num">${money(val)}</span><br><span class="tiny num" style="color:${val>=c?'var(--good)':'var(--bad)'}">${val>=c?'+':'−'}${money(Math.abs(val-c))}</span></span></button>`}).join('')}</div><div class="row" style="gap:8px"><button class="btn soft" data-act="addInv">+ เพิ่มการลงทุน</button><button class="btn soft" data-act="addTxCat" data-v="invest">บันทึกเงินลงทุนเพิ่ม</button></div></div>`;
    return h;
  }
  if(!S.ins.length)return h+`<div class="sec">${empty('บันทึกกรมธรรม์ทั้งหมดเพื่อดูวันครบกำหนดจ่ายเบี้ย ความคุ้มครอง และเบี้ยที่ใช้ลดหย่อนภาษีได้','เพิ่มประกัน','addIns')}</div>`;
  const yr=sum(S.ins,insYear),tax=sum(S.ins.filter(p=>p.tax),insYear);const inc=num(S.meta.income)*12;
  h+=`<div class="sec"><div class="card"><div class="meta"><span>เบี้ยรวมต่อปี <b>${baht(yr)}</b></span><span>เข้าเงื่อนไขลดหย่อน <b>${baht(tax)}</b></span>${inc?`<span>คิดเป็น <b>${(yr/inc*100).toFixed(1)}%</b> ของรายได้ทั้งปี</span>`:''}</div>${inc&&yr/inc>.15?'<p class="hint" style="margin:6px 0 0">เบี้ยประกันเกิน 15% ของรายได้ ลองทบทวนว่าเป็นประกันออมทรัพย์ที่เกินจำเป็นหรือไม่ ประกันสุขภาพและอุบัติเหตุควรเก็บไว้ก่อน</p>':''}</div>
  <div class="list">${S.ins.map(p=>{const n=insNext(p),dd=daysBetween(todayStr(),n);return`<button class="li" data-act="editIns" data-id="${p.id}"><span class="ic" style="background:var(--lilac-soft);color:var(--lilac)">${esc(p.kind.replace(/^[เแโใไ]/,'').slice(0,1))}</span><span class="t"><b>${esc(p.name)}</b><span>${esc(p.kind)}${p.insurer?' · '+esc(p.insurer):''}${num(p.coverage)?' · คุ้มครอง '+baht(p.coverage):''}</span></span><span style="text-align:right"><span class="amt num">${money(p.premium)}</span><br><span class="tiny" style="color:${dd<0?'var(--bad)':dd<=30?'var(--warn)':'var(--muted)'}">${FREQ[p.freq]||''} · ${fmtDate(n)}</span></span></button>`}).join('')}</div><button class="btn soft" data-act="addIns">+ เพิ่มประกัน</button><p class="hint">สิทธิลดหย่อนภาษีของประกันแต่ละแบบมีเงื่อนไขและเพดานต่างกัน ตรวจสอบกับบริษัทประกันหรือกรมสรรพากรก่อนยื่นภาษี</p></div>`;
  return h;
}

function recommendPlan(){const T=totals();const inc=num(S.meta.income);if(!T.debtTotal)return'growth';if(inc&&T.minTotal/inc>=.4)return'sprint';if(T.debtTotal<inc*2)return'balance';return'debtor'}
/* ========== sheets & forms ========== */
let sheetClose=null;
function openSheet(html,onMount){const root=$('#sheetRoot');root.innerHTML=`<div class="overlay" data-act="closeSheetBg"><div class="sheet" role="dialog" aria-modal="true"><div class="grab"></div>${html}</div></div>`;document.body.style.overflow='hidden';onMount&&onMount(root.querySelector('.sheet'));const f=root.querySelector('input:not([type=hidden]):not([type=radio]):not([type=checkbox])');if(f&&matchMedia('(pointer:fine)').matches)f.focus()}
function closeSheet(){$('#sheetRoot').innerHTML='';document.body.style.overflow=''}
function toast(msg){const t=document.createElement('div');t.className='toast';t.textContent=msg;document.body.appendChild(t);setTimeout(()=>t.remove(),2200)}
function confirmSheet(title,body,okLabel,fn){openSheet(`<h2>${esc(title)}</h2><p class="muted">${esc(body)}</p><div class="actions"><button class="btn soft" data-act="closeSheet">ยกเลิก</button><button class="btn danger" id="okBtn">${esc(okLabel)}</button></div>`,el=>el.querySelector('#okBtn').onclick=async()=>{closeSheet();await fn()})}
const opt=(v,l,sel)=>`<option value="${esc(v)}" ${String(v)===String(sel)?'selected':''}>${esc(l)}</option>`;
const fld=(label,inner,hint)=>`<label class="fld"><span>${label}</span>${inner}${hint?`<span class="hint">${hint}</span>`:''}</label>`;

function txForm(t){
  const type=t.type||'out';const cats=CATDEF[type];const cat=CAT[t.cat]&&CAT[t.cat].type===type?t.cat:cats[0][0];const c=CAT[cat];
  let linkSel='';
  if(c.link){let src=[];const lk=c.link;
    if(lk==='debt')src=S.debts.map(d=>['debt:'+d.id,d.name+' (คงเหลือ '+money(debtBal(d))+')']);
    if(lk==='card')src=S.cards.map(x=>['card:'+x.id,x.name+' (ค้าง '+money(cardBal(x))+')']);
    if(lk==='goal')src=S.goals.map(g=>['goal:'+g.id,g.name]);
    if(lk==='inv')src=S.invs.map(v=>['inv:'+v.id,v.name]);
    if(lk==='ins')src=S.ins.map(p=>['ins:'+p.id,p.name]);
    if(lk==='gi')src=[...S.goals.map(g=>['goal:'+g.id,'ออม: '+g.name]),...S.invs.map(v=>['inv:'+v.id,'ลงทุน: '+v.name])];
    const req=lk==='card';
    linkSel=src.length?fld({debt:'จ่ายหนี้ก้อนไหน',card:'บัตรใบไหน',goal:'เข้ากระปุกไหน',inv:'ลงทุนตัวไหน',ins:'กรมธรรม์ไหน',gi:'ถอนจากไหน'}[lk],`<select name="link" id="tx-link">${req?'':opt('','— ไม่ระบุ —',t.link)}${src.map(([v,l])=>opt(v,l,t.link)).join('')}</select>`):`<p class="hint">ยังไม่มีรายการให้ผูก <button type="button" class="linkbtn" data-act="${{debt:'addDebt',card:'addCard',goal:'addGoal',inv:'addInv',ins:'addIns',gi:'addGoal'}[lk]}">เพิ่มก่อน</button> (ข้ามได้)</p>`;
  }
  let intF='';
  if(c.link==='debt'&&t.link){const d=S.debts.find(x=>'debt:'+x.id===t.link);if(d){const est=Math.round(dInt(d));intF=d.flat?`<p class="hint">หนี้นี้คิดดอกแบบคงที่ ยอดจ่ายทั้งหมดจะตัดยอดค่างวดคงเหลือ</p>`:fld('ส่วนที่เป็นดอกเบี้ย',`<input name="interest" id="tx-int" inputmode="decimal" class="num" value="${t.interest??''}" placeholder="${est}">`,`เว้นว่าง = ประมาณ ${baht(est)} ตามดอก ${num(d.rate)}% · เงินต้นจะลดเท่ากับยอดจ่ายลบดอกเบี้ย`)}}
  const payF=type==='out'&&S.cards.length?fld('จ่ายด้วย',`<select name="pay" id="tx-pay">${opt('','เงินสด / โอน / เดบิต',t.pay)}${S.cards.map(x=>opt('card:'+x.id,'รูดบัตร '+x.name,t.pay)).join('')}</select>`):'';
  return`<h2>${t.id?'แก้ไขรายการ':'บันทึกรายการ'}</h2><form class="f" id="txForm">
  <div class="seg">${[['out','รายจ่าย'],['in','รายรับ'],['pay','ชำระบัตร']].map(([k,l])=>`<label><input type="radio" name="type" value="${k}" ${type===k?'checked':''}><span>${l}</span></label>`).join('')}</div>
  ${fld('จำนวนเงิน (บาท)',`<input name="amount" id="tx-amt" class="amtin num" inputmode="decimal" required value="${t.amount??''}" placeholder="0">`)}
  <div class="two">${fld('หมวด',`<select name="cat" id="tx-cat">${cats.map(([k,l,g])=>opt(k,l+(g&&type==='out'?' · '+GROUPS[g].l:''),cat)).join('')}</select>`)}${fld('วันที่',`<input type="date" name="date" id="tx-date" value="${t.date||todayStr()}" required>`)}</div>
  ${linkSel}${intF}${payF}
  ${fld('โน้ต',`<input name="note" id="tx-note" value="${esc(t.note||'')}" placeholder="เช่น ข้าวกลางวัน, ค่าห้อง ต.ค.">`)}
  ${t.id?'':`<label class="chk"><input type="checkbox" name="recur" id="tx-recur" ${t.recur?'checked':''}> ทำซ้ำทุกเดือน (เพิ่มในรายการประจำ)</label>`}
  <div class="actions">${t.id?`<button type="button" class="btn danger" data-act="delTx" data-id="${t.id}">ลบ</button>`:'<span></span>'}<span class="row" style="gap:8px"><button type="button" class="btn soft" data-act="closeSheet">ยกเลิก</button><button class="btn green">บันทึก</button></span></div></form>`;
}
function readForm(form){const o={};new FormData(form).forEach((v,k)=>o[k]=v);form.querySelectorAll('input[type=checkbox]').forEach(c=>o[c.name]=c.checked);return o}
function openTx(t={}){
  const draw=d=>openSheet(txForm(d),el=>{const f=el.querySelector('#txForm');
    f.addEventListener('change',e=>{if(['type','cat','link'].includes(e.target.name)){const v=readForm(f);const nd={...d,...v,amount:v.amount,interest:v.interest===''?undefined:v.interest};if(e.target.name==='type'){nd.cat=undefined;nd.link=undefined;nd.pay=undefined}if(e.target.name==='cat')nd.link=undefined;nd.interest=undefined;draw(nd)}});
    f.addEventListener('submit',async e=>{e.preventDefault();const v=readForm(f);const amt=num(v.amount);if(amt<=0){toast('ใส่จำนวนเงินมากกว่า 0');return}
      const c=CAT[v.cat];const rec={id:d.id||uid(),ts:d.ts||Date.now(),type:v.type,amount:amt,cat:v.cat,date:v.date||todayStr(),note:(v.note||'').trim()};
      if(v.link)rec.link=v.link;if(v.type==='out'&&v.pay)rec.pay=v.pay;if(d.recurId)rec.recurId=d.recurId;
      if(c.link==='debt'&&rec.link){const dd=S.debts.find(x=>'debt:'+x.id===rec.link);rec.interest=dd.flat?0:v.interest!==undefined&&v.interest!==''?num(v.interest):Math.min(amt,Math.round(dInt(dd)))}
      if(c.link==='card'&&!rec.link){toast('เลือกบัตรที่จะชำระ');return}
      if(v.recur){const r={id:uid(),type:rec.type,amount:amt,cat:rec.cat,note:rec.note,link:rec.link,pay:rec.pay,day:parse(rec.date).getDate()};await dbPut('recur',r);S.recur.push(r);rec.recurId=r.id}
      await dbPut('tx',rec);closeSheet();await afterTxChange([d.link,d.pay,rec.link,rec.pay]);toast(d.id?'แก้ไขแล้ว':'บันทึกแล้ว')});
  });
  draw(t);
}
async function afterTxChange(keys){await refreshKeys([...new Set(keys.filter(Boolean))]);await loadMonth();bumpPeak();if(S.searchRes&&S.search)S.searchRes=await txSearch(S.search);render()}
function bumpPeak(){const T=totals();if(T.debtTotal>num(S.meta.peakDebt)){S.meta.peakDebt=Math.round(T.debtTotal);saveMeta()}}

let dlCap;async function getDl(){if(dlCap===undefined){try{dlCap=window.claude?.use?await Promise.race([window.claude.use('downloads'),new Promise(r=>setTimeout(()=>r(null),10000))]):null}catch(e){dlCap=null}}return dlCap}
async function offerFile(filename,data){const d=await getDl();
  if(d){try{await d.save({filename,data});toast('บันทึกไฟล์แล้ว');return}catch(e){if(e?.code==='declined')return;if(e?.code==='rate_limited'){toast('รอสักครู่แล้วลองใหม่');return}}}
  if(!window.claude){try{const bl=data instanceof Blob?data:new Blob([data],{type:'text/plain;charset=utf-8'});const u=URL.createObjectURL(bl);const a=document.createElement('a');a.href=u;a.download=filename;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),5000);toast('ดาวน์โหลดแล้ว');return}catch(e){}}
  if(typeof data==='string'){openSheet(`<h2>คัดลอกข้อมูล</h2><p class="small muted">หน้านี้ดาวน์โหลดไฟล์ไม่ได้ คัดลอกข้อความด้านล่างไปวางในโน้ตหรือไฟล์ชื่อ ${esc(filename)} แทน</p><textarea id="cpTxt" style="width:100%;height:200px;border:1px solid var(--line);border-radius:12px;background:var(--bg);padding:10px;font-size:12px" readonly>${esc(data)}</textarea><div class="actions"><button class="btn soft" data-act="closeSheet">ปิด</button><button class="btn green" id="cpBtn">คัดลอก</button></div>`,el=>el.querySelector('#cpBtn').onclick=()=>{const ta=el.querySelector('#cpTxt');navigator.clipboard?.writeText(data).then(()=>toast('คัดลอกแล้ว')).catch(()=>{ta.select();toast('กดค้างเพื่อคัดลอก')})})}
  else toast('เบราว์เซอร์นี้ดาวน์โหลดไฟล์ไม่ได้');
}

async function exportCSV(){const all=await dbAll('tx');all.sort((a,b)=>a.date.localeCompare(b.date));const q=v=>'"'+String(v??'').replace(/"/g,'""')+'"';

/* ========== boot ========== */
async function boot(){
  try{const hash=(location.hash||'').slice(1);if(TABS.some(t=>t[0]===hash))S.tab=hash}catch(_){}
  idb=await openDB();S.persist=!!idb;
  if(idb){try{await rq(os('meta').get('settings'))}catch(e){idb=null;S.persist=false}}
  const has=(await dbAll('meta')).length>0;
  if(!has){if(S.fresh){await dbPut('meta',defaultMeta());S.needSetup=true}else await seedDemo();}
  await loadEntities();await loadMedia();await loadMonth();bumpPeak();render();
  if(S.needSetup){S.needSetup=false;openSetup()}
  try{if(navigator.storage?.persist)navigator.storage.persist()}catch(_){}
}

<div class="sec"><div class="card stack">
<p style="margin:0">เราทำงานเป็นกะ รายได้แต่ละเดือนไม่เท่ากัน ขึ้นกับค่าเวร OT และงานเสริม ลองจดใน Excel ลองให้ AI ช่วยวางแผน ได้แผนสวยๆ มาหลายแบบ แต่พอถึงเดือนที่ค่าเวรน้อย หรือมีค่าใช้จ่ายโผล่มา แผนก็พัง</p>
<p style="margin:0">สิ่งที่ยากที่สุดเลยไม่ใช่การคำนวณ แต่คือการรู้ทุกวันว่าใช้ได้อีกเท่าไหร่ และทำตามแผนต่อได้ทุกเดือน แอปนี้เลยเกิดขึ้น ทำให้ตัวเองใช้ก่อน แล้วเปิดให้คนที่อยู่ในจุดเดียวกันใช้ฟรี</p>
</div></div>
<div class="sec"><h2>ทำมาเพื่อใคร</h2><div class="who">
<div class="card"><b>พยาบาลและสายสุขภาพ</b><p>รายได้มีทั้งเงินเดือน ค่าเวร OT แอปแยก "รายได้ประจำ" ออกจาก "เงินพิเศษ" ให้ ตั้งงบจากเงินที่แน่นอนเท่านั้น</p></div>
<div class="card"><b>คนทำงานเป็นกะ รายได้ไม่คงที่</b><p>เงินพิเศษเข้าเมื่อไหร่ แอปแบ่งให้ทันทีว่าโปะหนี้เท่าไหร่ ออมเท่าไหร่ ใช้ได้เท่าไหร่</p></div>
<div class="card"><b>วัยทำงานที่มีหนี้ก้อนใหญ่</b><p>บ้าน รถ ปนกับบัตรเครดิตและ Pay Later แอปจัดลำดับให้ว่าก้อนไหนควรปิดก่อน</p></div>
<div class="card"><b>คนที่อยากปลดหนี้และโตไปพร้อมกัน</b><p>ไม่ต้องรอหนี้หมดถึงจะเริ่มออม มีเงินสำรอง พอร์ตลงทุน และประกัน อยู่ในที่เดียว</p></div>
</div></div>
<div class="sec"><h2>หลักที่แอปนี้ยึด</h2><div class="card"><ul class="plain">
<li><b>ใส่ตามจริง ไม่โกหกตัวเอง</b> ตัวเลขที่สวยเกินจริงทำให้แผนพัง คิดขาดดีกว่าคิดเกิน</li>
<li><b>ไม่ขายฝัน</b> ถ้าค่างวดเกินกำลัง แอปจะบอกตรงๆ พร้อมทางออกที่ทำได้</li>
<li><b>ข้อมูลเป็นของคุณ</b> เก็บในเครื่องคุณเท่านั้น ไม่มีบัญชี ไม่มีเซิร์ฟเวอร์ ไม่มีโฆษณา</li>
<li><b>ฟรีทั้งหมด</b> ใช้ได้ทุกเบราว์เซอร์ ทั้งมือถือ แท็บเล็ต และคอม</li>
</ul></div></div>

function waffle(parts,total){ // parts:[[label,value,color]] → 100 cells
  const raw=parts.map(p=>({...p,c:Math.max(0,p[1])/total*100}));let cells=raw.map(p=>Math.floor(p.c));let left=100-sum(cells,x=>x);
  raw.map((p,i)=>[p.c-cells[i],i]).sort((a,b)=>b[0]-a[0]).forEach(([,i])=>{if(left>0){cells[i]++;left--}});
  let k=0,sv='';raw.forEach((p,i)=>{for(let j=0;j<cells[i];j++){const x=(k%10)*22,y=Math.floor(k/10)*22;sv+=`<rect x="${x+1}" y="${y+1}" width="19" height="19" rx="6" fill="${p[2]}"><title>${esc(p[0])}</title></rect>`;k++}});
  return{svg:`<svg viewBox="0 0 220 220" class="waffle" role="img" aria-label="แผนภูมิ 100 ช่อง">${sv}</svg>`,cells:raw.map((p,i)=>[p[0],cells[i],p[2],p[1]])};
}

function ruleKey(b){if(b.kind==='card')return'card';if(b.kind==='ins')return'ins';if(b.kind==='recur')return'bill';const k=b.dk||'';
  if(/บ้าน/.test(k))return'home';if(/รถ/.test(k))return'car';if(/กยศ/.test(k))return'student';if(/Pay Later/.test(k))return'paylater';if(/0%/.test(k))return'zero';if(/นอกระบบ/.test(k))return'informal';if(/คนรู้จัก/.test(k))return'friend';return'loan'}

/* ========== bills & alerts ========== */
function bills(){const t0=todayStr();const y=now.getFullYear(),m=now.getMonth();const[ms,me]=monthBounds(y,m);
  const due=d=>ymd(new Date(y,m,Math.min(num(d),new Date(y,m+1,0).getDate())));
  const paid=k=>(S.ent['L:'+k]||[]).some(t=>t.date>=ms&&t.date<=me);const out=[];
  S.debts.forEach(d=>{const bal=debtBal(d);if(!num(d.dueDay)||bal<=0)return;const p=paid('debt:'+d.id);const dd=p?addMonths(due(d.dueDay),1):due(d.dueDay);
    out.push({kind:'debt',id:d.id,dk:d.kind,name:d.name,amt:Math.min(num(d.minPay),bal),due:dd,days:daysBetween(t0,dd),paid:p,act:'payDebt',rate:dRate(d)||num(d.rate),day:num(d.dueDay)})});
  S.cards.forEach(c=>{const bal=cardBal(c);if(!num(c.dueDay)||bal<=0)return;const p=paid('card:'+c.id);const dd=p?addMonths(due(c.dueDay),1):due(c.dueDay);
    out.push({kind:'card',id:c.id,name:c.name,amt:cardMin(c,bal),full:bal,due:dd,days:daysBetween(t0,dd),paid:p,act:'payCard',rate:num(c.rate)||16,day:num(c.dueDay)})});
  S.ins.forEach(p=>{const dd=insNext(p);out.push({kind:'ins',id:p.id,name:'เบี้ย'+p.name,amt:num(p.premium),due:dd,days:daysBetween(t0,dd),paid:false,act:'payIns',freq:num(p.freq)||12,day:parse(dd).getDate()})});
  const doneR=new Set(S.monthTx.filter(t=>t.recurId).map(t=>t.recurId));
  if(S.y===y&&S.m===m)S.recur.filter(r=>r.type==='out'&&!r.link).forEach(r=>{const dd=due(r.day);const p=doneR.has(r.id);out.push({kind:'recur',id:r.id,name:r.note||CAT[r.cat]?.l||'บิล',amt:num(r.amount),due:p?addMonths(dd,1):dd,days:daysBetween(t0,p?addMonths(dd,1):dd),paid:p,act:'postRecur',day:num(r.day)})});
  return out.sort((a,b)=>a.days-b.days);
}
const leadDays=()=>num(S.meta.lead??3)||3;
function alertsNow(){if(S.meta.alertsOff)return[];return bills().filter(b=>!b.paid&&b.days<=leadDays())}
function lateCost(b,days){const d=Math.max(1,days);const k=ruleKey(b);
  if(k==='card')return Math.round((b.full||b.amt)*16/100*d/365+(d>0?(b.full>1000?50:0):0));
  if(k==='loan'||k==='home')return Math.round(b.amt*((b.rate||0)+3)/100*d/365+(k==='loan'&&b.amt>1000?50:0));
  if(k==='student')return Math.round(b.amt*0.5/100*d/365);return 0}
function statusText(b){if(b.paid)return'จ่ายแล้วเดือนนี้ · งวดถัดไป '+fmtDate(b.due);if(b.days<0)return'เลยกำหนด '+(-b.days)+' วัน';if(b.days===0)return'ครบกำหนดวันนี้';return'อีก '+b.days+' วัน · '+fmtDate(b.due)}
function gcalURL(b,before=0){const d=parse(b.due);d.setDate(d.getDate()-before);const s=ymd(d).replace(/-/g,'');const e=ymd(new Date(d.getFullYear(),d.getMonth(),d.getDate()+1)).replace(/-/g,'');
  const r=RULES[ruleKey(b)];const title=before?`เตรียมเงิน: ${b.name} อีก ${before} วัน`:`จ่าย ${b.name} ฿${money(b.amt)}`;
  const det=`${before?'อีก '+before+' วันครบกำหนดจ่าย '+b.name+' ฿'+money(b.amt)+'\n':''}ถ้าเลยกำหนด: ${r.late[0]}\nจ่ายแล้วอย่าลืมบันทึกในแอปถั่วงอก Money`;
  const rr=b.kind==='ins'?`RRULE:FREQ=MONTHLY;INTERVAL=${b.freq||12}`:'RRULE:FREQ=MONTHLY';
  return'https://calendar.google.com/calendar/render?action=TEMPLATE&text='+encodeURIComponent(title)+'&dates='+s+'/'+e+'&details='+encodeURIComponent(det)+'&recur='+encodeURIComponent(rr)}
function billCard(b,open){const k=ruleKey(b),r=RULES[k];const st=b.paid?'good':b.days<0?'bad':b.days<=leadDays()?'warn':'';const lc=lateCost(b,7);
  return`<details class="g bill ${st}" ${open?'open':''}><summary><span class="row" style="gap:10px;min-width:0"><span class="ic" style="background:${st==='bad'?'var(--peach-soft)':st==='warn'?'var(--sun-soft)':st==='good'?'var(--sprout-soft)':'var(--surface2)'};color:${st==='bad'?'var(--bad)':st==='warn'?'var(--warn)':st==='good'?'var(--good)':'var(--muted)'}">${b.paid?'✓':b.days<0?'!':b.days}</span><span style="min-width:0"><b style="display:block">${esc(b.name)} <span class="num">${baht(b.amt)}</span></b><span class="small muted">${statusText(b)}</span></span></span></summary>
  <div class="body stack small"><div><span class="chip">${esc(r.t)}</span> ${esc(r.cycle)}</div>
  <div><b>ถ้าจ่ายช้า</b><ul>${r.late.map(x=>`<li>${esc(x)}</li>`).join('')}</ul>${lc&&!b.paid?`<div class="latebox">ถ้าช้า 7 วัน เสียเพิ่มประมาณ <b>${baht(lc)}</b> · ช้า 30 วัน ประมาณ <b>${baht(lateCost(b,30))}</b></div>`:''}</div>

/* CSV import */
function parseCSV(text){text=text.replace(/^﻿/,'');const rows=[];let row=[],f='',q=false;
  for(let i=0;i<text.length;i++){const c=text[i];if(q){if(c==='"'){if(text[i+1]==='"'){f+='"';i++}else q=false}else f+=c}
    else if(c==='"')q=true;else if(c===','){row.push(f);f=''}else if(c==='\n'||c==='\r'){if(c==='\r'&&text[i+1]==='\n')i++;row.push(f);rows.push(row);row=[];f=''}else f+=c}
  if(f!==''||row.length){row.push(f);rows.push(row)}return rows.filter(r=>r.some(x=>x.trim()!==''))}
function parseDateAny(s){s=String(s||'').trim();let m;
  if(m=s.match(/^(\d{4})-(\d{1,2})-(\d{1,2})/)){let y=+m[1];if(y>2400)y-=543;return`${y}-${pad(+m[2])}-${pad(+m[3])}`}
  if(m=s.match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})/)){let y=+m[3];if(y>2400)y-=543;return`${y}-${pad(+m[2])}-${pad(+m[1])}`}
  if(/^\d{5}(\.\d+)?$/.test(s)){const d=new Date(Date.UTC(1899,11,30)+Math.floor(+s)*864e5);return ymd(new Date(d.getUTCFullYear(),d.getUTCMonth(),d.getUTCDate()))}
  return null}
async function importSheetCSV(text){const rows=parseCSV(text);if(rows.length<2)throw new Error('ไฟล์ว่าง');
  const hi=rows.findIndex(r=>r.some(c=>c.trim()==='วันที่')&&r.some(c=>c.trim()==='จำนวนเงิน'));if(hi<0)throw new Error('ไม่พบหัวคอลัมน์ "วันที่" และ "จำนวนเงิน" ให้ดาวน์โหลดชีต "รายการ"');
  const head=rows[hi].map(c=>c.trim());const ix=n=>head.indexOf(n);const I={id:ix('id'),d:ix('วันที่'),t:ix('ประเภท'),c:ix('หมวด'),a:ix('จำนวนเงิน'),p:ix('จ่ายด้วย'),l:ix('ผูกกับ'),i:ix('ดอกเบี้ย'),n:ix('โน้ต')};
  const typeOf=s=>({'รายรับ':'in','รายจ่าย':'out','ชำระบัตร':'pay'})[String(s).trim()]||'out';
  const catBy={};Object.values(CAT).forEach(c=>catBy[c.type+'|'+c.l]=c.k);
  const ent=(name,pref)=>{name=String(name||'').trim();if(!name)return undefined;const src={debt:S.debts,card:S.cards,goal:S.goals,inv:S.invs,ins:S.ins};for(const p of pref){const e=src[p]?.find(x=>x.name===name);if(e)return p+':'+e.id}return undefined};
  const existing=new Map((await dbAll('tx')).map(t=>[t.id,t]));let add=0,upd=0,bad=0;const out=[];
  rows.slice(hi+1).forEach((r,k)=>{const date=parseDateAny(r[I.d]);const amt=num(r[I.a]);if(!date||!(amt>0)){bad++;return}
    const type=typeOf(r[I.t]);const cl=String(r[I.c]||'').trim();let cat=catBy[type+'|'+cl]||(type==='in'?'otherin':type==='pay'?'cardpay':'other');const c=CAT[cat];
    const id=(I.id>=0&&String(r[I.id]||'').trim())||('im'+uid());const old=existing.get(id);
    const t={id,ts:old?.ts||Date.now()+k,date,type,cat,amount:amt,note:I.n>=0?String(r[I.n]||'').trim():''};
    if(old?.recurId)t.recurId=old.recurId;
    const lk=c.link==='gi'?ent(r[I.l],['goal','inv']):c.link?ent(r[I.l],[c.link]):undefined;if(lk)t.link=lk;
    if(type==='out'){const pk=ent(r[I.p],['card']);if(pk)t.pay=pk}
    if(I.i>=0&&String(r[I.i]||'').trim()!=='')t.interest=num(r[I.i]);
    if(old){const same=['date','type','cat','amount','note','link','pay','interest'].every(k=>String(old[k]??'')===String(t[k]??''));if(same)return;upd++}else add++;out.push(t)});
  return{out,add,upd,bad};
}

const GS_CODE="/**\n * ถั่วงอก Money → Google Sheets (Apps Script)\n * วางโค้ดนี้ใน ส่วนขยาย → Apps Script ของ Google ชีตที่ต้องการเก็บข้อมูล\n * แล้ว Deploy เป็น Web app (Execute as: Me, Who has access: Anyone)\n */\nconst KEY = '__KEY__'; // รหัสเชื่อมต่อ ต้องตรงกับในแอป\nconst TX = 'รายการ';\nconst HEAD = ['id','วันที่','ปี','เดือน','ประเภท','หมวด','กลุ่มงบ','จำนวนเงิน','จ่ายด้วย','ผูกกับ','ดอกเบี้ย','โน้ต'];\nconst GROUPS = ['จำเป็น','ผ่อนหนี้','ออม/ลงทุน','พัฒนาตัวเอง','ความสุข'];\n\nfunction out_(o) {\n  return ContentService.createTextOutput(JSON.stringify(o)).setMimeType(ContentService.MimeType.JSON);\n}\nfunction toDate_(s) {\n  const p = String(s).split('-');\n  return new Date(+p[0], +p[1] - 1, +p[2]);\n}\nfunction fmt_(d) {\n  return d instanceof Date ? Utilities.formatDate(d, Session.getScriptTimeZone() || 'Asia/Bangkok', 'yyyy-MM-dd') : String(d || '');\n}\n\nfunction doPost(e) {\n  try {\n    const d = JSON.parse(e.postData.contents);\n    if (d.key !== KEY) return out_({ ok: false, error: 'รหัสเชื่อมต่อไม่ถูกต้อง' });\n    const lock = LockService.getScriptLock();\n    lock.waitLock(20000);\n    try {\n      const ss = SpreadsheetApp.getActiveSpreadsheet();\n      if (d.action === 'sync') {\n        writeTx_(ss, d.rows || []);\n        writeTable_(ss, 'หนี้และบัตร', d.debtHead || [], d.debts || []);\n        writeTable_(ss, 'ออมและลงทุน', d.saveHead || [], d.saves || []);\n        writeSummary_(ss, d.rows || []);\n        return out_({ ok: true, rows: (d.rows || []).length, at: new Date().toISOString(), name: ss.getName() });\n      }\n      return out_({ ok: false, error: 'ไม่รู้จักคำสั่ง' });\n    } finally {\n      lock.releaseLock();\n    }\n  } catch (err) {\n    return out_({ ok: false, error: String(err) });\n  }\n}\n\nfunction doGet(e) {\n  const p = (e && e.parameter) || {};\n  if (p.key !== KEY) return out_({ ok: false, error: 'รหัสเชื่อมต่อไม่ถูกต้อง' });\n  const ss = SpreadsheetApp.getActiveSpreadsheet();\n  if (p.action === 'ping') return out_({ ok: true, name: ss.getName() });\n  const rows = readTx_(ss);\n  if (p.action === 'tx') return out_({ ok: true, head: HEAD, rows: rows });\n  if (p.action === 'summary') return out_({ ok: true, ...summarize_(rows) });\n  return out_({ ok: false, error: 'ไม่รู้จักคำสั่ง' });\n}\n\nfunction readTx_(ss) {\n  const sh = ss.getSheetByName(TX);\n  if (!sh || sh.getLastRow() < 2) return [];\n  return sh.getRange(2, 1, sh.getLastRow() - 1, HEAD.length).getValues()\n    .filter(r => r[1] !== '' && r[7] !== '')\n    .map(r => r.map((c, i) => (i === 1 ? fmt_(c) : c)));\n}\n\nfunction writeTx_(ss, rows) {\n  const sh = ss.getSheetByName(TX) || ss.insertSheet(TX, 0);\n  sh.clearContents();\n  sh.getRange(1, 1, 1, HEAD.length).setValues([HEAD]).setFontWeight('bold').setBackground('#E04FB5').setFontColor('#FFFFFF');\n  if (rows.length) {\n    const vals = rows.map(r => { const x = r.slice(0, HEAD.length); while (x.length < HEAD.length) x.push(''); x[1] = toDate_(x[1]); return x; });\n    sh.getRange(2, 1, vals.length, HEAD.length).setValues(vals);\n    sh.getRange(2, 2, vals.length, 1).setNumberFormat('yyyy-mm-dd');\n    sh.getRange(2, 8, vals.length, 1).setNumberFormat('#,##0.00');\n  }\n  sh.setFrozenRows(1);\n}\n\nfunction writeTable_(ss, name, head, rows) {\n  const sh = ss.getSheetByName(name) || ss.insertSheet(name);\n  sh.clearContents();\n  if (!head.length) return;\n  sh.getRange(1, 1, 1, head.length).setValues([head]).setFontWeight('bold').setBackground('#E04FB5').setFontColor('#FFFFFF');\n  if (rows.length) sh.getRange(2, 1, rows.length, head.length).setValues(rows.map(r => { const x = r.slice(0, head.length); while (x.length < head.length) x.push(''); return x; }));\n  sh.setFrozenRows(1);\n}\n\nfunction summarize_(rows) {\n  const m = {}, y = {};\n  const blank = () => ({ inc: 0, out: 0, debt: 0, save: 0, need: 0, grow: 0, joy: 0 });\n  rows.forEach(r => {\n    const date = String(r[1]), type = r[4], group = r[6], amt = Number(r[7]) || 0;\n    const mk = date.slice(0, 7), yk = date.slice(0, 4);\n    [[m, mk], [y, yk]].forEach(([o, k]) => {\n      o[k] = o[k] || blank();\n      if (type === 'รายรับ' && r[5] !== 'ถอนเงินออม/ขายลงทุน') o[k].inc += amt;\n      if (type === 'รายจ่าย') {\n        o[k].out += amt;\n        if (group === 'ผ่อนหนี้') o[k].debt += amt;\n        if (group === 'ออม/ลงทุน') o[k].save += amt;\n        if (group === 'จำเป็น') o[k].need += amt;\n        if (group === 'พัฒนาตัวเอง') o[k].grow += amt;\n        if (group === 'ความสุข') o[k].joy += amt;\n      }\n    });\n  });\n  const toList = o => Object.keys(o).sort().map(k => ({ key: k, ...o[k] }));\n  return { months: toList(m), years: toList(y), count: rows.length, at: new Date().toISOString() };\n}\n\nfunction writeSummary_(ss, rows) {\n  const s = summarize_(rows.map(r => { const x = r.slice(); x[1] = String(x[1]); return x; }));\n  const head = ['ช่วง', 'รายรับ', 'รายจ่าย', 'จำเป็น', 'ผ่อนหนี้', 'ออม/ลงทุน', 'พัฒนาตัวเอง', 'ความสุข', 'คงเหลือ', 'อัตราออม'];\n  const line = o => [o.key, o.inc, o.out, o.need, o.debt, o.save, o.grow, o.joy, o.inc - o.out, o.inc ? o.save / o.inc : 0];\n  [['สรุปรายเดือน', s.months], ['สรุปรายปี', s.years]].forEach(([name, list]) => {\n    const sh = ss.getSheetByName(name) || ss.insertSheet(name);\n    sh.clearContents();\n    sh.getRange(1, 1, 1, head.length).setValues([head]).setFontWeight('bold').setBackground('#E04FB5').setFontColor('#FFFFFF');\n    if (list.length) {\n      sh.getRange(2, 1, list.length, head.length).setValues(list.map(line));\n      sh.getRange(2, 1, list.length, 1).setNumberFormat('@');\n      sh.getRange(2, 2, list.length, 8).setNumberFormat('#,##0');\n      sh.getRange(2, 10, list.length, 1).setNumberFormat('0%');\n    }\n    sh.setFrozenRows(1);\n  });\n}\n";

async function gsCall(method,params,body){const g=gs();if(!g.url)throw new Error('ยังไม่ได้ใส่ลิงก์ Web App');

  const u=new URL(g.url);if(params)Object.entries(params).forEach(([k,v])=>u.searchParams.set(k,v));

    const t=await r.text();let j;try{j=JSON.parse(t)}catch(_){throw new Error('ตอบกลับไม่ใช่ข้อมูลที่ถูกต้อง ตรวจว่า Deploy แบบ "Anyone" แล้ว')}

{const old=saveReview;saveReview=async function(){if(typeof syncReviewFromDom==='function')syncReviewFromDom();

{const old=slipCard;slipCard=function(){return old()+'<!--slipEnd-->'}}
function dayGroupsHTML(){const tx=S.monthTx||[];

  if(!tx.length)return`<div class="sec">${head}${empty('ยังไม่มีรายการในเดือนนี้','จดรายการแรก','addTx')}</div>`;
  const by={};tx.forEach(t=>(by[t.date]=by[t.date]||[]).push(t));
